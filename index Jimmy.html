<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>JIMMY — Bad Decisions, Great Stories</title>
<style>
  :root{
    --bg:#111318; --panel:#1c2028; --text:#f5f5f5; --muted:#b9c0cc;
    --accent:#f0b44d; --danger:#e36b6b; --ok:#70c18b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #app{width:min(100vw,980px);height:100vh;max-height:900px;display:flex;flex-direction:column;background:linear-gradient(#171b22,#0f1116)}
  header{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .title{font-weight:900;letter-spacing:.08em;font-size:clamp(22px,4vw,34px)}
  .subtitle{font-size:12px;color:var(--muted);letter-spacing:.05em}
  #hud{display:flex;gap:14px;font-weight:700;font-size:13px;text-align:right}
  #stage{position:relative;flex:1;min-height:0}
  canvas{display:block;width:100%;height:100%;background:#20303b}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(9,11,15,.68);backdrop-filter:blur(4px)}
  .card{width:min(640px,94%);max-height:92%;overflow:auto;background:rgba(27,31,39,.96);border:1px solid #3a414f;border-radius:18px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .card h1,.card h2{margin:0 0 10px}.card p{color:#d5d9e0;line-height:1.45}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
  button{appearance:none;border:0;border-radius:14px;padding:14px 16px;font:inherit;font-weight:800;background:#303745;color:white;cursor:pointer}
  button.primary{background:var(--accent);color:#17130a}
  button.danger{background:var(--danger);color:#1a0b0b}
  button:active{transform:translateY(1px)}
  .small{font-size:12px;color:var(--muted)}
  #controls{padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;background:#11151b;border-top:1px solid #2a303a}
  #controls button{min-height:64px;font-size:16px;touch-action:manipulation}
  #jump{background:#dde3eb;color:#15171b}
  #send{background:var(--accent);color:#17130a}
  #brake{background:#3a4251}
  .meter{height:9px;background:#343a45;border-radius:999px;overflow:hidden;margin-top:4px}
  .meter > div{height:100%;width:0;background:linear-gradient(90deg,#d8d8d8,#f0b44d,#e36b6b)}
  .quote{font-size:20px;font-weight:800;line-height:1.3;margin:18px 0;padding:16px;border-left:4px solid var(--accent);background:#141820;border-radius:0 12px 12px 0}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .stat{background:#141820;padding:10px;border-radius:10px}.stat b{display:block;font-size:18px}
  @media (max-height:620px){
    header{padding:8px 12px}.subtitle{display:none}#controls button{min-height:50px}.card{padding:16px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="title">JIMMY</div>
      <div class="subtitle">BAD DECISIONS. GREAT STORIES.</div>
    </div>
    <div id="hud">
      <div>Score <span id="score">0</span></div>
      <div>Jimmy Meter
        <div class="meter"><div id="meterFill"></div></div>
      </div>
    </div>
  </header>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <div class="card" id="card"></div>
    </div>
  </div>

  <div id="controls">
    <button id="brake">BRAKE</button>
    <button id="jump">JUMP</button>
    <button id="send">SEND IT</button>
  </div>
</div>

<script>
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const card = document.getElementById('card');
const scoreEl = document.getElementById('score');
const meterFill = document.getElementById('meterFill');

let W=900,H=500,scale=1;
function resize(){
  const r=canvas.getBoundingClientRect();
  canvas.width=Math.max(600,Math.floor(r.width*devicePixelRatio));
  canvas.height=Math.max(300,Math.floor(r.height*devicePixelRatio));
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=r.width; H=r.height;
}
addEventListener('resize',resize);

const modeData={
  snow:{name:'Snowboard',ground:'#e8eef4',sky:'#8eb5cf',dark:'#597d96',obstacles:['tree','rock','kicker']},
  bike:{name:'Mountain Bike',ground:'#8b6748',sky:'#8cb6c4',dark:'#42616f',obstacles:['tree','rock','drop']}
};

let mode='snow', running=false, ended=false;
let score=0, meter=0, speed=6, t=0, runTime=0;
let obstacles=[], particles=[];
let player={x:130,y:0,vy:0,w:34,h:48,onGround:true,rot:0};
let braking=false, sendIt=false;
let closeCalls=0, airTime=0, maxAir=0, totalAir=0;
let injuryHistory=[];

const lines=[
  "This is probably not the right time to tell this story.",
  "I was specifically asked not to bring this up.",
  "I have a theory about hot tubs and liability waivers.",
  "You know what? I'm going to say it anyway.",
  "The doctor said six weeks. He didn't say six weeks of what.",
  "Technically, I've only been banned from one ski lodge.",
  "I can explain. I probably shouldn't, but I can.",
  "Everyone got real quiet, so I assume I made my point.",
  "Before anybody overreacts, there's context.",
  "This story ends with a helmet, a wedding, and a misunderstanding."
];

const injuries=[
  "Two bruised ribs and wounded pride",
  "Left wrist: 'probably fine'",
  "Shoulder upgraded to 'concerning'",
  "One rib Jimmy swears was already like that",
  "Hip-shaped bruise of unclear origin",
  "Arm: structurally annoyed",
  "Ego intact. Everything else under review"
];

function groundY(x){
  return H*0.76 + Math.sin((x+t*speed)*0.012)*8 + Math.sin((x+t*speed)*0.004)*18;
}

function resetGame(){
  score=0; meter=0; speed=6; t=0; runTime=0; obstacles=[]; particles=[];
  closeCalls=0; airTime=0; maxAir=0; totalAir=0;
  player={x:Math.min(140,W*.18),y:groundY(130)-48,vy:0,w:34,h:48,onGround:true,rot:0};
  ended=false; running=true; updateHUD();
}

function startScreen(){
  running=false;
  overlay.style.display='flex';
  card.innerHTML=`
    <h1>JIMMY</h1>
    <p>He has experience, confidence, old injuries, and absolutely no evidence that any of those things should slow him down.</p>
    <div class="modes">
      <button class="primary" id="snowMode">SNOWBOARD</button>
      <button class="primary" id="bikeMode">MOUNTAIN BIKE</button>
    </div>
    <p><b>How to play:</b> Jump obstacles. Brake when wisdom briefly takes over. Hold <b>SEND IT</b> to go faster, score more, and make choices Jimmy's orthopedist would oppose.</p>
    <p class="small">The Jimmy Meter rewards speed, airtime and near misses. A full meter is impressive right up until it isn't.</p>`;
  document.getElementById('snowMode').onclick=()=>begin('snow');
  document.getElementById('bikeMode').onclick=()=>begin('bike');
}

function begin(m){
  mode=m; overlay.style.display='none'; resetGame();
}

function spawnObstacle(){
  const types=modeData[mode].obstacles;
  const type=types[Math.floor(Math.random()*types.length)];
  let o={x:W+40,type,w:34,h:50,hit:false,passed:false};
  if(type==='rock'){o.w=36;o.h=24}
  if(type==='kicker' || type==='drop'){o.w=56;o.h=22}
  obstacles.push(o);
}

function jump(){
  if(!running || !player.onGround) return;
  player.vy = sendIt ? -13.8 : -12.2;
  player.onGround=false;
  meter=Math.min(100,meter+3);
}
function setBrake(v){ braking=v; }
function setSend(v){ sendIt=v; }

document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
for(const [id,setter] of [['brake',setBrake],['send',setSend]]){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();setter(true)});
  b.addEventListener('pointerup',e=>{e.preventDefault();setter(false)});
  b.addEventListener('pointercancel',()=>setter(false));
  b.addEventListener('pointerleave',()=>setter(false));
}
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp') jump();
  if(e.code==='ArrowLeft') braking=true;
  if(e.code==='ArrowRight') sendIt=true;
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft') braking=false;
  if(e.code==='ArrowRight') sendIt=false;
});

function updateHUD(){
  scoreEl.textContent=Math.floor(score);
  meterFill.style.width=meter+'%';
}

function crash(o){
  running=false; ended=true;
  const injury=injuries[Math.floor(Math.random()*injuries.length)];
  injuryHistory.push(injury);
  for(let i=0;i<28;i++) particles.push({
    x:player.x+player.w/2,y:player.y+player.h/2,
    vx:(Math.random()-.5)*10,vy:(Math.random()-.8)*9,life:40+Math.random()*35
  });
  let spins=0;
  const crashAnim=setInterval(()=>{
    drawScene();
    player.rot += .3;
    player.x += 3;
    player.y += 3;
    drawPlayer();
    drawParticles();
    spins++;
    if(spins>26){clearInterval(crashAnim); showResults(true,injury);}
  },30);
}

function finish(){
  running=false; ended=true; showResults(false,null);
}

function showResults(crashed,injury){
  const quote=lines[Math.floor(Math.random()*lines.length)];
  const risk=Math.round(meter);
  const scoreFinal=Math.floor(score + (crashed?0:750));
  overlay.style.display='flex';
  card.innerHTML=`
    <h2>${crashed?'RUN TERMINATED':'JIMMY LIVES'}</h2>
    <div class="quote">“${quote}”</div>
    <div class="stats">
      <div class="stat"><span>Score</span><b>${scoreFinal}</b></div>
      <div class="stat"><span>Jimmy Meter</span><b>${risk}%</b></div>
      <div class="stat"><span>Close calls</span><b>${closeCalls}</b></div>
      <div class="stat"><span>Airtime</span><b>${totalAir.toFixed(1)} sec</b></div>
    </div>
    ${crashed?`<p><b>Diagnosis:</b> ${injury}.</p><p><b>Jimmy's assessment:</b> “I can probably ride tomorrow.”</p>`:
    `<p><b>Medical outcome:</b> Suspiciously intact.</p><p><b>Jimmy's assessment:</b> “We should do one more.”</p>`}
    <div class="modes">
      <button class="primary" id="again">ONE MORE RUN</button>
      <button id="menu">CHANGE SPORT</button>
    </div>
    <p class="small">Lifetime documented incidents this session: ${injuryHistory.length}</p>`;
  score=scoreFinal; updateHUD();
  document.getElementById('again').onclick=()=>{overlay.style.display='none'; resetGame()};
  document.getElementById('menu').onclick=startScreen;
}

function update(dt){
  if(!running) return;
  runTime += dt;
  t += dt*60;

  const targetSpeed = braking ? 3.8 : sendIt ? 9.2 : 6.2 + meter*.018;
  speed += (targetSpeed-speed)*.05;

  if(sendIt){
    meter=Math.min(100,meter+dt*4.5);
    score += dt*38;
  } else if(braking){
    meter=Math.max(0,meter-dt*5.5);
  } else {
    meter=Math.max(0,meter-dt*1.2);
  }

  score += dt*12*speed/6;

  if(Math.random() < dt*(0.55 + speed*.035) && (obstacles.length===0 || obstacles[obstacles.length-1].x < W-220)){
    spawnObstacle();
  }

  const gy=groundY(player.x)-player.h;
  if(!player.onGround){
    player.vy += 28*dt;
    player.y += player.vy;
    airTime += dt;
    totalAir += dt;
    maxAir=Math.max(maxAir,airTime);
    player.rot += sendIt ? .06 : .025;
    if(player.y>=gy){
      player.y=gy; player.vy=0; player.onGround=true; player.rot=0;
      if(airTime>.45){
        score += Math.floor(airTime*280*(1+meter/100));
        meter=Math.min(100,meter+airTime*7);
      }
      airTime=0;
    }
  } else {
    player.y=gy;
  }

  for(const o of obstacles){
    o.x -= speed*60*dt;
    const oy=groundY(o.x)-o.h;
    const px1=player.x+5, px2=player.x+player.w-5;
    const py1=player.y+8, py2=player.y+player.h-4;
    const ox1=o.x, ox2=o.x+o.w, oy1=oy, oy2=oy+o.h;
    if(!o.hit && px2>ox1 && px1<ox2 && py2>oy1 && py1<oy2){
      o.hit=true; crash(o); return;
    }
    if(!o.passed && o.x+o.w < player.x){
      o.passed=true;
      const clearance = Math.abs((player.y+player.h)-oy);
      if(clearance<25){
        closeCalls++; meter=Math.min(100,meter+8); score+=180;
      } else score+=80;
    }
  }
  obstacles=obstacles.filter(o=>o.x>-100);

  if(runTime>42) finish();
  updateHUD();
}

function drawScene(){
  const d=modeData[mode];
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=d.sky; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.22;
  ctx.fillStyle=d.dark;
  for(let i=0;i<7;i++){
    const x=(i*190-(t*speed*.09)%190)-80;
    ctx.beginPath();ctx.moveTo(x,H*.63);ctx.lineTo(x+100,H*.28);ctx.lineTo(x+210,H*.63);ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W+20;x+=18) ctx.lineTo(x,groundY(x));
  ctx.lineTo(W,H);ctx.closePath();
  ctx.fillStyle=d.ground;ctx.fill();

  for(const o of obstacles) drawObstacle(o);
}

function drawObstacle(o){
  const y=groundY(o.x)-o.h;
  if(o.type==='tree'){
    ctx.fillStyle='#5b3b2a';ctx.fillRect(o.x+13,y+15,8,o.h-15);
    ctx.fillStyle='#234e38';
    ctx.beginPath();ctx.moveTo(o.x+17,y-10);ctx.lineTo(o.x-7,y+34);ctx.lineTo(o.x+42,y+34);ctx.fill();
  } else if(o.type==='rock'){
    ctx.fillStyle='#6e7479';
    ctx.beginPath();ctx.moveTo(o.x,y+o.h);ctx.lineTo(o.x+8,y+4);ctx.lineTo(o.x+28,y);ctx.lineTo(o.x+o.w,y+o.h);ctx.fill();
  } else {
    ctx.fillStyle=mode==='snow'?'#c8d5df':'#5d4937';
    ctx.beginPath();ctx.moveTo(o.x,y+o.h);ctx.lineTo(o.x+o.w,y);ctx.lineTo(o.x+o.w,y+o.h);ctx.fill();
  }
}

function drawPlayer(){
  ctx.save();
  ctx.translate(player.x+player.w/2,player.y+player.h/2);
  ctx.rotate(player.rot);
  ctx.lineWidth=4;ctx.strokeStyle='#171a20';ctx.fillStyle='#f0b44d';
  ctx.beginPath();ctx.arc(0,-16,8,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(-2,12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-2,0);ctx.lineTo(13,6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-2,11);ctx.lineTo(-14,23);ctx.moveTo(-2,11);ctx.lineTo(14,22);ctx.stroke();
  if(mode==='snow'){
    ctx.lineWidth=5;ctx.strokeStyle='#2b3038';ctx.beginPath();ctx.moveTo(-24,25);ctx.lineTo(26,25);ctx.stroke();
  } else {
    ctx.lineWidth=3;ctx.strokeStyle='#232831';
    ctx.beginPath();ctx.arc(-15,24,11,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(18,24,11,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-15,24);ctx.lineTo(0,8);ctx.lineTo(18,24);ctx.lineTo(-15,24);ctx.stroke();
  }
  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/70);
    ctx.fillStyle='#f0b44d';ctx.fillRect(p.x,p.y,5,5);
    p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.life--;
  }
  ctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(running) update(dt);
  if(!ended || running){
    drawScene();
    drawPlayer();
    drawParticles();
  }
  requestAnimationFrame(loop);
}

resize();
startScreen();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
