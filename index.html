}
@media(orientation:landscape) and (max-height:500px){

 .result-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:7px}.quote{font-size:10px;margin:3px 0;padding:5px}.stats{margin:0 0 3px}.stat{font-size:7px;padding:3px}.stat b{font-size:10px}
 .secondary{margin:3px 0;gap:4px}.secondary button{padding:5px;font-size:8px}.scoreboard{grid-template-columns:repeat(3,1fr);gap:5px}.board{padding:5px}.board h3{font-size:10px}.row{font-size:7px;padding:2px 0}

<body>
<div id="app">
<header>
 <div><div class="title">JIMMY</div><div class="subtitle">FAST LINES. GREAT STORIES.</div></div>
 <div id="hud">
  <div id="alert">WILDLIFE</div><div id="section">CRUISE</div>
  <div>SCORE<br><b id="score">0</b></div>
  <div>SPEED<br><b id="speed">0 mph</b></div>
  <div id="flowHud">FLOW<b id="flowValue">x1.00</b><div class="flowMini"><div id="flowFill"></div></div></div>
  <div id="rideState">RIDE<b id="rideStateValue">CRUISE</b></div>
  <div id="ratingHud">RATING<b id="ratingValue">OPEN</b></div>
  <button id="audioBtn" type="button">SOUND</button>
  <div>JIMMY METER<div class="meter"><div id="meterFill"></div></div></div>
 </div>
</header>
<div id="stage"><canvas id="game"></canvas><div id="signatureTrack"><div class="sigLabel">SIGNATURE RUN</div><b id="signatureName">OBJECTIVE</b><span id="signatureProgress">READY</span></div><div id="overlay"><div class="card" id="card"></div></div></div>
<div id="controls"><button id="brake">BRAKE</button><button id="jump">JUMP</button><button id="send">SEND IT</button></div>
</div>
<script>
(()=>{
const BUILD_VERSION='v57';
const SCREEN_DESCENT=.115;
document.documentElement.dataset.build=BUILD_VERSION;
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),overlay=$('overlay'),card=$('card');
const scoreEl=$('score'),speedEl=$('speed'),meterFill=$('meterFill'),alertEl=$('alert'),sectionEl=$('section'),brakeBtn=$('brake'),jumpBtn=$('jump'),sendBtn=$('send'),flowValue=$('flowValue'),flowFill=$('flowFill'),audioBtn=$('audioBtn'),rideStateValue=$('rideStateValue'),ratingHud=$('ratingHud'),ratingValue=$('ratingValue'),signatureTrack=$('signatureTrack'),signatureName=$('signatureName'),signatureProgress=$('signatureProgress');
let W=900,H=500,mode='snow',running=false,ended=false,score=0,meter=0,speed=6,runTime=0,world=0;
let terrain=[],terrainFeatures=[],complexBounds=[],obstacles=[],particles=[],nextSpawn=520,wildlifeUsed=false,eventUsed=false,maintenanceUsed=false,lineChoices={},choiceCueTimer=0,braking=false,brakeHold=0,sendIt=false,closeCalls=0,totalAir=0,airTime=0,maxMeter=0,lastAutoLaunch=-9999,physicsCue='',physicsCueTimer=0,flowChain=0,bestFlowChain=0,flowTimer=0,lineSet=0,airLineSet=0,lineSetReady=false,signatureAwarded=false,stability=100,stabilityCueReady=true;
let jumpTapCount=0,lastJumpTap=0,airTrick='',tricksLanded=0;
let masteryStreak=0,bestMasteryStreak=0,masteredSections=0,nextMasteryFeature=0,fastLineClears=0,controlLineClears=0,lastRatingTier=0,lastSignatureProgress='';
let player={x:130,y:0,vy:0,w:36,h:52,onGround:true,rot:0};
let animClock=0,landingSquash=0,wheelSpin=0;
let audioOn=true,audioCtx=null,lastToneAt=0;

const MODES={
 snow:{name:'BIG BEAR',sport:'SNOWBOARD',tag:'SPEED, SNOW & QUESTIONABLE MARGINS',sky1:'#6fa5ca',sky2:'#d9e9f2',ob:['tree','rock','kicker','snowgun'],wild:'bear',event:'skier'},
 bike:{name:'ORANGE COUNTY',sport:'MOUNTAIN BIKE',tag:'RIDGELINES, DUST & VELOCITY',sky1:'#86b7ca',sky2:'#dfbb82',ob:['rock','log','drop','trailpost'],wild:'lion',event:'hiker'},
 board:{name:'SOCAL STREETS',sport:'LONGBOARD',tag:'DOWNHILL LINES & CLEAN SPEED',sky1:'#73a8cc',sky2:'#f0b17b',ob:['cone','pothole','curb','trashcan'],wild:null,event:'pedestrian'}
};
const quotes=[
 "There was a safer line. It was also slower.",
 "That was calculated. The calculation just had a wide confidence interval.",
 "Speed is information. You just have to process it quickly.",
 "I saw the line. I still like the line.",
 "The problem wasn't the idea. The problem was the landing.",
 "You can learn a lot at forty miles an hour."
];
const injuries=["Two bruised ribs and an intact theory of speed","Left wrist: operational, with reservations","Shoulder requesting a design review","Hip-shaped bruise of aerodynamic origin","Ego intact. Suspension geometry under review"];
// Drop Kurt's recorded Jimmy files into this list later; crash playback is already wired.
const CRASH_VOICE_CLIPS=[];


function ensureAudio(){
 if(!audioOn)return null;
 try{
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
 }catch(_){return null}
}
function tone(freq=440,dur=.07,type='sine',gain=.035,slide=0){
 const ac=ensureAudio();if(!ac)return;
 const now=ac.currentTime;if(now-lastToneAt<.018)return;lastToneAt=now;
 const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);if(slide)o.frequency.linearRampToValueAtTime(Math.max(40,freq+slide),now+dur);
 g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
 o.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+dur+.02);
}
function sfx(kind){
 if(!audioOn)return;
 if(kind==='jump')tone(240,.09,'triangle',.04,170);
 else if(kind==='land')tone(170,.07,'sine',.035,-35);
 else if(kind==='skill'){tone(520,.07,'triangle',.035,110);setTimeout(()=>tone(690,.07,'triangle',.025,80),55)}
 else if(kind==='brake')tone(mode==='snow'?110:95,.055,'sawtooth',.018,-18);
 else if(kind==='send')tone(260,.08,'square',.025,120);
 else if(kind==='fastline'){tone(360,.065,'triangle',.028,150);setTimeout(()=>tone(610,.08,'triangle',.024,85),48)}
 else if(kind==='controlline'){tone(285,.07,'sine',.026,55);setTimeout(()=>tone(390,.085,'triangle',.022,40),55)}
 else if(kind==='miss')tone(155,.10,'sine',.022,-35);
 else if(kind==='rating'){tone(440,.075,'triangle',.03,105);setTimeout(()=>tone(620,.08,'triangle',.028,95),58);setTimeout(()=>tone(790,.10,'sine',.024,70),120)}
 else if(kind==='crash'){tone(120,.16,'sawtooth',.055,-70);setTimeout(()=>tone(65,.22,'square',.045,-18),70)}
}
function noiseHit(delay=0,dur=.055,gain=.035){
 const ac=ensureAudio();if(!ac)return;const start=ac.currentTime+delay;
 const buffer=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate),data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
 const src=ac.createBufferSource(),filter=ac.createBiquadFilter(),g=ac.createGain();filter.type='bandpass';filter.frequency.value=950;g.gain.value=gain;src.buffer=buffer;src.connect(filter);filter.connect(g);g.connect(ac.destination);src.start(start)
}
function runIntro(){
 if(!audioOn)return;ensureAudio();
 const riff=[110,110,146.8,123.5,110,164.8,146.8,123.5];
 riff.forEach((f,i)=>setTimeout(()=>{tone(f,.13,'sawtooth',.045,i%2?18:-8);if(i%2===1)noiseHit(0,.05,.038)},i*105));
 setTimeout(()=>{tone(220,.34,'square',.035,110);tone(329.6,.30,'sawtooth',.025,70)},880)
}
function playCrashVoice(){
 if(!audioOn||!CRASH_VOICE_CLIPS.length)return;
 const clip=new Audio(CRASH_VOICE_CLIPS[Math.floor(Math.random()*CRASH_VOICE_CLIPS.length)]);
 clip.volume=.82;clip.play().catch(()=>{})
}
function updateAudioButton(){audioBtn.textContent=audioOn?'SOUND':'MUTED';audioBtn.classList.toggle('muted',!audioOn)}
audioBtn.addEventListener('click',e=>{e.preventDefault();audioOn=!audioOn;updateAudioButton();if(audioOn){ensureAudio();tone(420,.06,'triangle',.025,90)}});
updateAudioButton();

function rand(a,b){return a+Math.random()*(b-a)}
function hash(n){let x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)}
function resize(){
 // Mobile rotation safety: preserve Jimmy's terrain-relative clearance instead of leaving an airborne
 // y-position stranded in the old portrait/landscape pixel space.
 const oldH=H;
 const wasAirborne=!player.onGround;
 const oldGround=groundY(player.x)-player.h;
 const oldClearance=wasAirborne?Math.max(0,oldGround-player.y):0;
 let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(500,Math.floor(r.width*d));canvas.height=Math.max(260,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;
 const newGround=groundY(player.x)-player.h;
 if(player.onGround){
  player.y=newGround;
 }else if(oldH>0){
  const scale=Math.max(.55,Math.min(1.8,H/oldH));
  player.y=newGround-Math.min(H*.72,oldClearance*scale);
  // Keep the jump's direction and energy believable without letting a large rotation resize
  // multiply vertical speed into an instant crash or an absurd launch.
  const velocityScale=Math.max(.78,Math.min(1.24,Math.sqrt(scale)));
  player.vy*=velocityScale;
 }
}
addEventListener('resize',resize);if(visualViewport)visualViewport.addEventListener('resize',resize);

function buildTerrain(){
 terrain=[];terrainFeatures=[];complexBounds=[];
 let y=mode==='snow'?.72:.74;

 // Base terrain keeps the world organic, while authored complexes below create readable course identity.
 for(let x=0;x<42000;x+=60){
  let delta=rand(-.010,.010);
  if(mode==='bike')delta+=rand(-.008,.008);
  if(mode==='snow')delta*=.42;
  y=Math.max(mode==='snow'?.61:.56,Math.min(.82,y+delta));
  terrain.push({x,y});
 }

 // Course phrases: linked, environment-specific complexes instead of isolated feature spam.
 // v40 adds a fourth signature sequence per environment with a distinct terrain grammar, not just another reordered feature set.
 // Each complex has an approach, a technical decision, a payoff, then enough open ground to recover.
 const complexes={

function checkLineMastery(){
 // Completing a named technical section at useful speed creates run-level progression.
 // Heavy braking can save a run, but it will not earn mastery: Jimmy has to be controlled and still carrying pace.

 while(nextMasteryFeature<terrainFeatures.length){
  const f=terrainFeatures[nextMasteryFeature];
  if(f.x+f.width>riderWx)break;
  nextMasteryFeature++;
  if(!f.complex||!f.label)continue;
  const choice=f.complexId!==undefined?lineChoices[f.complexId]:null;
  const baseThreshold=mode==='snow'?6.15:mode==='bike'?5.55:5.25;
  // FAST LINE is the higher-risk score route: it demands more exit speed and pays more.
  // CONTROL LINE rewards deliberate pace management: a lower speed gate, smaller award, and a little more meter recovery.
  const threshold=choice==='fast'?baseThreshold*1.08:choice==='control'?baseThreshold*.90:baseThreshold;
  if(speed>=threshold){
   masteryStreak++;
   masteredSections++;
   bestMasteryStreak=Math.max(bestMasteryStreak,masteryStreak);
   if(choice==='fast')fastLineClears++;
   if(choice==='control')controlLineClears++;
   const streakBase=220+Math.min(5,masteryStreak-1)*70;
   const styleMult=choice==='fast'?1.35:choice==='control'?.88:1;
   const label=choice==='fast'?'FAST LINE CLEAN':choice==='control'?'CONTROL LINE CLEAN':'LINE MASTERED';
   const pts=skillAward(Math.round(streakBase*styleMult),label);
   physicsCue=label+'  x'+masteryStreak+'  +'+pts;
   physicsCueTimer=1.15;
   const meterGain=choice==='control'?Math.min(10,5+masteryStreak):Math.min(8,3+masteryStreak);
   meter=Math.min(100,meter+meterGain);
  }else{
   masteryStreak=0;

   }
  }
 }
}

 updateLineChoice();

 const downhill=Math.max(-.08,Math.min(.08,slope));

 // Braking is progressive: a quick touch is a controlled speed check; holding it becomes a hard brake.
 // This preserves flow when Jimmy only needs to trim a line, while sustained braking remains unmistakably strong.

   target=1.55;

  }

 // Terrain now matters: descents add speed, climbs scrub it; braking still wins over gravity.

 speed+=(target-speed)*Math.min(1,response*dt);
 speed=Math.max(1.35,Math.min(11.1,speed));

 // v47 high-speed stability: sharp terrain transitions load the edge/front end/trucks.
 // Jimmy can carry serious speed, but entering a technical compression or direction change

 if(player.onGround){
  const slopeBack=terrainSlopeAt(wx-36), slopeAhead=terrainSlopeAt(wx+64);
  const transitionLoad=Math.min(.62,Math.abs(slopeAhead-slopeBack));
  const modeThreshold=mode==='snow'?6.65:mode==='bike'?6.35:6.15;
  const excess=Math.max(0,speed-modeThreshold);

  if(load>0){

   physicsCue=mode==='snow'?'EDGE LOAD':mode==='bike'?'FRONT END LOAD':'SPEED WOBBLE';
   physicsCueTimer=.72;stabilityCueReady=false;
  }

 if(sendIt){meter=Math.min(100,meter+dt*4.7);score+=dt*42}

function dynamicAtmospherePass(){
 // v43 environment-graphics pass: moving atmospheric detail that reinforces place and speed without affecting gameplay.
 ctx.save();
 const t=performance.now()*.001;
 if(mode==='snow'){
  // Fine windblown powder and occasional longer gusts; all screen-space and non-collidable.
  ctx.lineCap='round';
  for(let i=0;i<34;i++){
   const seed=i*37.17;
   const drift=(world*.22 + t*(34+(i%5)*7) + seed*19)%(W+120)-60;
   const y=H*.18 + ((seed*29)%Math.max(80,H*.60));
   const len=7+(i%6)*3;
   ctx.globalAlpha=.11+(i%4)*.035;
   ctx.strokeStyle='#ffffff';ctx.lineWidth=1+(i%3)*.35;
   ctx.beginPath();ctx.moveTo(drift,y);ctx.lineTo(drift-len,y+2.5);ctx.stroke();
  }
  ctx.globalAlpha=.12;ctx.strokeStyle='#d8edf7';ctx.lineWidth=2;
  for(let i=0;i<5;i++){
   const x=(i*257-(world*.41+t*46)%257)-70;
   const y=H*.50+(i%3)*24;
   ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+55,y-8,x+118,y-2);ctx.stroke();
  }
 }else if(mode==='bike'){
  // OC dust hangs low in the canyon and trails the terrain direction, selling dry speed without obscuring hazards.
  for(let i=0;i<22;i++){
   const seed=i*53.41;
   const x=(seed*17-world*.18+t*(7+(i%4)*2))%(W+100)-50;
   const gy=groundY(Math.max(0,Math.min(W,x)));
   const y=gy-18-((seed*11)%74);
   const r=1.2+(i%5)*.75;
   ctx.globalAlpha=.055+(i%4)*.025;ctx.fillStyle='#e8c18d';
   ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=.065;ctx.fillStyle='#c8945f';
  for(let i=0;i<5;i++){
   const x=(i*243-(world*.33+t*10)%243)-60, y=H*.59+(i%3)*17;
   ctx.beginPath();ctx.ellipse(x,y,72+(i%2)*25,8,0,0,Math.PI*2);ctx.fill();
  }
 }else{
  // SoCal gets subtle asphalt heat shimmer plus layered smog streaks; lines stay below the main action silhouette.
  ctx.globalAlpha=.075;ctx.strokeStyle='#ffd6b5';ctx.lineWidth=1.2;
  for(let i=0;i<10;i++){
   const baseY=H*.69+i*9;
   ctx.beginPath();
   for(let x=0;x<=W;x+=18){
    const y=baseY+Math.sin(x*.035+t*2.2+i*.9)*1.8;
    x?ctx.lineTo(x,y):ctx.moveTo(x,y);
   }
   ctx.stroke();
  }
  for(let i=0;i<9;i++){
   const x=(i*151-(world*.28+t*14)%151)-45;
   const y=H*.44+(i%4)*18;
   ctx.globalAlpha=.035+(i%3)*.02;ctx.fillStyle='#edb090';
   ctx.beginPath();ctx.ellipse(x,y,58+(i%3)*16,5,0,0,Math.PI*2);ctx.fill();
  }
 }
 ctx.restore();
}

}

function drawPlayer(){
 const airborne=!player.onGround;
 const bob=player.onGround?Math.sin(animClock*8.5+world*.022)*.9:0;
 const squash=landingSquash*4.8;
 const carve=Math.sin(animClock*2.35+world*.0065);
 const airStyle=Math.min(1,airTime/.72);
 // v32 character pass: flight-phase animation makes takeoff, established air, and landing preparation visibly distinct.
 // This is visual only; it does not alter jump, rotation, landing, or collision physics.
 const airRising=airborne&&player.vy<-2.2;
 const airLanding=airborne&&player.vy>2.4;
 const airFloat=airborne&&!airRising&&!airLanding;
 // v41 air-control readability: the existing midair pitch inputs now have clear sport-specific body language.
 // SEND IT reads as forward/committed; BRAKE reads as checking rotation and preparing to bring the nose up.
 const airForward=airborne&&sendIt;
 const airBack=airborne&&braking;
 const pace=Math.min(1,Math.max(0,(speed-4)/6));
 const brakePose=braking&&!airborne;
 const sendPose=sendIt&&!airborne;
 const linePose=lineSet>.42&&!airborne;
 const baseLean=(brakePose?-.10:sendPose?.11:0)+(airborne?Math.max(-.16,Math.min(.16,player.vy*.009)):0);
 const carveLean=player.onGround?carve*(mode==='snow'?.075:mode==='bike'?.045:.025)*pace:0;
 ctx.save();
 ctx.translate(player.x+18,player.y+26+bob+squash*.22);
 const trickRotation=airborne&&(airTrick==='BACKFLIP'||airTrick==='FRONTFLIP')?(airTime*5.8*(airTrick==='BACKFLIP'?-1:1)):0;
 ctx.rotate(player.rot+baseLean+carveLean+trickRotation);

 ctx.lineCap='round';ctx.lineJoin='round';
 const ink='#171a20',accent='#f2b84b',gear='#252b32';

 function head(x,y,r=8){
  // Jimmy fidelity pass: slightly longer, squarer face; high/receding hairline; visible brow/nose/half-smirk.
  ctx.save();ctx.translate(x,y);
  ctx.strokeStyle=ink;ctx.fillStyle=skin;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-r*.70,-r*.72);ctx.quadraticCurveTo(-r*.98,-r*.18,-r*.72,r*.46);
  ctx.quadraticCurveTo(-r*.40,r*.92,0,r*.96);ctx.quadraticCurveTo(r*.48,r*.93,r*.78,r*.48);
  ctx.quadraticCurveTo(r*.95,-r*.18,r*.66,-r*.70);ctx.quadraticCurveTo(0,-r*.96,-r*.70,-r*.72);ctx.closePath();ctx.fill();ctx.stroke();
  // high hairline with thinner front corners rather than a full cartoon cap of hair
  ctx.fillStyle=hair;ctx.beginPath();ctx.moveTo(-r*.62,-r*.67);ctx.quadraticCurveTo(-r*.20,-r*.98,0,-r*.80);
  ctx.quadraticCurveTo(r*.22,-r*.98,r*.61,-r*.65);ctx.lineTo(r*.42,-r*.48);ctx.quadraticCurveTo(.1*r,-r*.62,-.06*r,-r*.50);
  ctx.quadraticCurveTo(-r*.26,-r*.62,-r*.45,-r*.46);ctx.closePath();ctx.fill();
  // brow, compact nose, Jimmy half-smirk
  ctx.strokeStyle=ink;ctx.lineWidth=1.45;ctx.beginPath();ctx.moveTo(-r*.43,-r*.16);ctx.lineTo(-r*.08,-r*.20);ctx.moveTo(r*.08,-r*.19);ctx.lineTo(r*.42,-r*.13);ctx.stroke();
  ctx.beginPath();ctx.moveTo(r*.08,-r*.05);ctx.lineTo(r*.18,r*.17);ctx.lineTo(r*.06,r*.22);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r*.24,r*.46);ctx.quadraticCurveTo(r*.10,r*.58,r*.42,r*.38);ctx.stroke();
  // sport-specific accoutrements keep him readable even at sprite scale.
  if(mode==='snow'){
   ctx.fillStyle=jimBlue2;ctx.beginPath();ctx.arc(0,-r*.67,r*.82,Math.PI,Math.PI*2);ctx.fill();
   ctx.fillRect(-r*.78,-r*.72,r*1.56,r*.22);
   ctx.strokeStyle='#8fc0d8';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-r*.55,-r*.14);ctx.lineTo(-r*.08,-r*.18);ctx.lineTo(r*.54,-r*.12);ctx.stroke();
  }else if(mode==='bike'){
   ctx.fillStyle=gear;ctx.beginPath();ctx.arc(0,-r*.60,r*.88,Math.PI,Math.PI*2);ctx.fill();
   ctx.fillStyle=jimBlue;ctx.fillRect(-r*.72,-r*.76,r*1.44,r*.16);
   ctx.strokeStyle='#1a2228';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r*.50,-r*.12);ctx.lineTo(-r*.04,-r*.16);ctx.lineTo(r*.50,-r*.10);ctx.stroke();
  }else{
   // backwards cap + sunglasses for the SoCal longboard silhouette.
   ctx.fillStyle=jimBlue2;ctx.beginPath();ctx.arc(0,-r*.62,r*.82,Math.PI,Math.PI*2);ctx.fill();
   ctx.fillRect(-r*.64,-r*.70,r*1.28,r*.17);ctx.fillRect(-r*.95,-r*.62,r*.34,r*.13);
   ctx.strokeStyle='#1a2228';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r*.52,-r*.12);ctx.lineTo(-r*.06,-r*.16);ctx.lineTo(r*.50,-r*.10);ctx.stroke();
  }
  ctx.restore();
 }
 function torso(x1,y1,x2,y2,w=5){
  // Shaped jacket body replaces the old single thick line, giving Jimmy shoulders, waist and fabric volume.
  const dx=x2-x1,dy=y2-y1,len=Math.max(1,Math.hypot(dx,dy)),nx=-dy/len,ny=dx/len;
  const shoulder=w*.92,waist=w*.66;

  g.addColorStop(0,'#427eaa');g.addColorStop(.52,jimBlue);g.addColorStop(1,jimBlue2);
  ctx.fillStyle=g;ctx.strokeStyle=ink;ctx.lineWidth=2.2;ctx.beginPath();
  ctx.moveTo(x1+nx*shoulder,y1+ny*shoulder);ctx.lineTo(x1-nx*shoulder,y1-ny*shoulder);
  ctx.lineTo(x2-nx*waist,y2-ny*waist);ctx.lineTo(x2+nx*waist,y2+ny*waist);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(151,199,226,.48)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1+nx*shoulder*.45,y1+ny*shoulder*.45);ctx.lineTo(x2+nx*waist*.35,y2+ny*waist*.35);ctx.stroke();
  ctx.strokeStyle='rgba(17,38,54,.62)';ctx.beginPath();ctx.moveTo(x1+dx*.08+nx*shoulder,y1+dy*.08+ny*shoulder);ctx.lineTo(x1+dx*.08-nx*shoulder,y1+dy*.08-ny*shoulder);ctx.moveTo(x1+dx*.62+nx*waist,y1+dy*.62+ny*waist);ctx.lineTo(x1+dx*.62-nx*waist,y1+dy*.62-ny*waist);ctx.stroke();
 }
 function limb(x1,y1,x2,y2,w=4){
  ctx.strokeStyle=ink;ctx.lineWidth=w+2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.strokeStyle='#303b45';ctx.lineWidth=Math.max(1.7,w-1.2);ctx.stroke()
 }

 if(mode==='snow'){
  // Snowboard: sideways stance, low edge-set under braking, compact grab/tweak in longer air.
  const crouch=(sendPose?3.2:0)+(brakePose?5.2:0)+(linePose?2.0:0)+squash+(airborne?airStyle*1.5:0)+(airLanding?3.0:0);
  const hipY=9+crouch*.58, shoulderY=-7+crouch*.28, headY=-19+crouch*.30;
  const tweak=airborne?Math.sin(Math.min(1,airStyle)*Math.PI)*5:0;
  head(2,headY,8);
  limb(1,headY+8,-1,shoulderY,4.6);torso(-1,shoulderY,-2,hipY,4.8);
  // arms: balance on snow, rear-hand grab once established in the air
  if(airTrick==='SPREAD EAGLE'&&airFloat){
   limb(-1,shoulderY,-24,shoulderY-5,4);limb(0,shoulderY,24,shoulderY-5,4);
  }else if(airLanding){
   // Landing-ready: hands come forward and the stance compresses before contact.
   limb(-1,shoulderY,-13,shoulderY+5,4);limb(0,shoulderY,14,shoulderY+4,4);
  }else if(airForward){
   // SEND IT in the air: shoulders lead down-course and the rear arm trails, matching the forward pitch input.
   limb(-1,shoulderY,-13,shoulderY+7,4);limb(0,shoulderY,18,shoulderY-8,4);
  }else if(airBack){
   // BRAKE in the air: chest opens and both arms rise slightly as Jimmy checks the rotation.
   limb(-1,shoulderY,-17,shoulderY-7,4);limb(0,shoulderY,14,shoulderY-9,4);
  }else if(airborne&&airTime>.38){
   limb(-1,shoulderY,-12,shoulderY+4,4);limb(-12,shoulderY+4,-16,21-tweak*.2,3.6);
   limb(0,shoulderY,15,shoulderY-5-tweak*.3,4);
  }else{
   const spread=brakePose?17:sendPose?12:20;
   limb(-1,shoulderY,-spread,shoulderY+(carve*4),4);limb(0,shoulderY,spread-2,shoulderY-(carve*3),4);
  }
  // knees visibly absorb landings; bindings anchor the feet to the deck
  limb(-2,hipY,-13,18+crouch*.18,4.2);limb(-13,18+crouch*.18,-14,24,4.2);
  limb(-1,hipY,11,18+crouch*.12,4.2);limb(11,18+crouch*.12,13,23,4.2);
  const flex=player.onGround?(1.4+landingSquash*3.4):(.4+airStyle*.8);
  ctx.strokeStyle=ink;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-29,26+tweak*.08);ctx.quadraticCurveTo(0,26+flex,31,24-tweak*.10);ctx.stroke();
  ctx.strokeStyle=accent;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-17,24);ctx.lineTo(-12,19);ctx.moveTo(15,23);ctx.lineTo(10,18);ctx.stroke();

 }else if(mode==='bike'){
  // MTB: elbows and knees stay active, body moves independently from the bike, suspension compresses on impact.
  const compression=squash*1.05+(brakePose?2.6:0)+(linePose?1.2:0)+(airLanding?3.2:0);
  const rear={x:-16,y:25},front={x:20,y:25};
  const bikePitch=airborne?Math.max(-.08,Math.min(.08,-player.vy*.004)):0;
  ctx.save();ctx.rotate(bikePitch);
  ctx.strokeStyle=ink;ctx.lineWidth=3;
  for(const w of [rear,front]){ctx.save();ctx.translate(w.x,w.y);ctx.rotate(wheelSpin);ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1.25;for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.stroke();ctx.rotate(Math.PI/6)}ctx.restore()}
  const crankY=11+compression*.28;
  ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(rear.x,rear.y);ctx.lineTo(0,crankY);ctx.lineTo(front.x,front.y);ctx.lineTo(rear.x,rear.y);ctx.moveTo(0,crankY);ctx.lineTo(12,8+compression*.12);ctx.lineTo(18,7);ctx.stroke();
  ctx.restore();
  const hipX=airLanding?-4:airForward?4:airBack?-6:airborne?-1:brakePose?-5:sendPose?4:1;
  const hipY=7+compression*.34, shoulderX=airForward?8:airBack?-2:sendPose?7:brakePose?-2:4, shoulderY=-8+compression*.22;
  head(shoulderX+1,-20+compression*.18,7.6);
  limb(shoulderX, -12+compression*.18, shoulderX, shoulderY,4.5);torso(shoulderX,shoulderY,hipX,hipY,4.8);
  // both hands stay on bars; elbows flare more under braking and in rough landings
  const elbowDrop=airLanding?6:airBack?7:airForward?1:brakePose?7:airborne?2:4;
  limb(shoulderX,shoulderY,11,shoulderY+elbowDrop,4);limb(11,shoulderY+elbowDrop,18,7,3.8);
  limb(shoulderX-1,shoulderY,-4,shoulderY+elbowDrop+1,4);limb(-4,shoulderY+elbowDrop+1,15,7,3.8);
  // pedals / knees
  limb(hipX,hipY,-8,16+compression*.18,4.2);limb(-8,16+compression*.18,-1,20,4.1);
  limb(hipX,hipY,8,15+compression*.12,4.2);limb(8,15+compression*.12,2,20,4.1);

 }else{
  // Longboard: SEND IT becomes a compact speed tuck; braking reads as a deliberate speed-check carve.
  const tuck=sendPose?1:0;
  const check=brakePose?1:0;
  const crouch=2+squash+(tuck*6)+(check*3)+(linePose*1.5)+(airLanding?4.0:0);
  const bank=player.onGround?carve*.10*pace*(check?1.75:1):0;
  ctx.rotate(bank);
  const hipY=9+crouch*.55, shoulderY=-6+crouch*.35, headY=-18+crouch*.38;
  head(tuck?5:1,headY,7.8);
  limb(tuck?4:0,headY+8,tuck?5:0,shoulderY,4.5);torso(tuck?5:0,shoulderY,0,hipY,4.8);
  if(airLanding){
   // Landing-ready: shoulders square, arms lower, knees already loaded for impact.
   limb(0,shoulderY,-12,shoulderY+7,4);limb(1,shoulderY,13,shoulderY+7,4);
  }else if(airForward){
   // Forward pitch: compact, directional posture rather than a generic airborne silhouette.
   limb(0,shoulderY,-8,shoulderY+7,4);limb(1,shoulderY,16,shoulderY-7,4);
  }else if(airBack){
   // Rotation check: arms open and slightly high while the knees stay loaded beneath him.
   limb(0,shoulderY,-18,shoulderY-8,4);limb(1,shoulderY,17,shoulderY-5,4);
  }else if(tuck){
   // forearms tucked behind the lead knee instead of flailing at speed
   limb(4,shoulderY,10,5,4);limb(0,shoulderY,-4,6,4);
  }else if(check){
   // arms open during a controlled speed check; Jimmy remains composed.
   limb(0,shoulderY,-18,shoulderY-5,4);limb(1,shoulderY,18,shoulderY+4,4);
  }else{
   limb(0,shoulderY,-13,shoulderY+carve*3,4);limb(1,shoulderY,14,shoulderY-carve*3,4);
  }
  limb(0,hipY,-14,18+crouch*.10,4.2);limb(-14,18+crouch*.10,-17,24,4.1);
  limb(0,hipY,13,18+crouch*.08,4.2);limb(13,18+crouch*.08,17,24,4.1);
  const boardFlex=player.onGround?(1+landingSquash*2.8):.5;
  ctx.strokeStyle=ink;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-28,25);ctx.quadraticCurveTo(0,27+boardFlex,30,25);ctx.stroke();
  ctx.fillStyle='#202328';for(const wx of [-19,21]){ctx.save();ctx.translate(wx,29);ctx.rotate(wheelSpin*1.5);ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();ctx.restore()}
 }
 ctx.restore()
}

function drawCrashPlayer(progress,hit){
 // v49 Jimmy & animation: crashes now read differently by sport instead of using one generic pinwheel.
 // Visual-only choreography: no collision, scoring, speed, or recovery rules are changed.
 const t=Math.max(0,Math.min(1,progress));
 const ease=1-Math.pow(1-t,2);
 ctx.save();
 ctx.translate(player.x+18,player.y+26);
 const ink='#171a20',skin='#d6a06f',blue='#315f83',gear='#252b32',accent='#f2b84b';
 function L(x1,y1,x2,y2,w=4,c=ink){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
 function H(x,y,r=7.5){ctx.fillStyle=skin;ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#b59a6a';ctx.beginPath();ctx.arc(x,y-2,r*.8,Math.PI,Math.PI*2);ctx.fill()}
 if(mode==='snow'){
  // Snow: edge catches, board comes across the fall line, Jimmy separates into a compact shoulder roll.
  const r=-.18+ease*1.55;ctx.rotate(r);
  const sep=Math.max(0,(t-.32))*34;
  H(3,-19+sep*.18);L(2,-11,-1,7,5,blue);
  L(-1,0,-16,-6-sep*.15,4);L(0,0,15,7+sep*.10,4);
  L(-1,7,-13,20,4);L(-1,7,13,18,4);
  ctx.save();ctx.translate(0,sep);ctx.rotate(.25+ease*.9);ctx.strokeStyle=ink;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-30,25);ctx.quadraticCurveTo(0,28,31,24);ctx.stroke();ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-15,24);ctx.lineTo(-10,19);ctx.moveTo(14,23);ctx.lineTo(9,18);ctx.stroke();ctx.restore();
 }else if(mode==='bike'){
  // MTB: front-end event pitches the bike first; Jimmy goes over it rather than rotating as one rigid unit.
  const bodyRot=ease*1.25;ctx.rotate(bodyRot);
  const bikeDrop=Math.max(0,t-.24)*22;
  ctx.save();ctx.translate(-3,bikeDrop);ctx.rotate(ease*.95);
  ctx.strokeStyle=ink;ctx.lineWidth=3;for(const wx of [-16,20]){ctx.beginPath();ctx.arc(wx,25,11,0,Math.PI*2);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(-16,25);ctx.lineTo(0,11);ctx.lineTo(20,25);ctx.lineTo(-16,25);ctx.moveTo(0,11);ctx.lineTo(14,7);ctx.stroke();ctx.restore();
  H(7,-19);L(6,-11,1,6,5,blue);L(2,-5,-13,-1,4);L(3,-5,18,-8,4);L(1,6,-11,17,4);L(1,6,14,16,4);
 }else{
  // Longboard: trucks start to oscillate, board shoots ahead, Jimmy steps out before the tumble develops.
  const wobble=Math.sin(t*26)*(1-t)*.18;ctx.rotate(wobble+ease*.85);
  const boardShoot=ease*44;
  H(1,-19);L(1,-11,-1,7,5,blue);L(0,-3,-16,-8,4);L(0,-3,17,1,4);L(-1,7,-13,19,4);L(-1,7,15,21,4);
  ctx.save();ctx.translate(boardShoot,5);ctx.rotate(ease*.28);ctx.strokeStyle=ink;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-28,25);ctx.quadraticCurveTo(0,27,30,25);ctx.stroke();ctx.fillStyle=gear;for(const wx of [-19,21]){ctx.beginPath();ctx.arc(wx,29,4,0,Math.PI*2);ctx.fill()}ctx.restore();
 }
 ctx.restore();
}

function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/70);ctx.fillStyle=mode==='snow'?'#fff':mode==='bike'?'#d6ad79':'#bbb';ctx.fillRect(p.x,p.y,5,5);p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.life--}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0)}

let last=performance.now();
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;if(running)update(dt);if(!ended||running){drawScene();brakeSpray();drawPlayer();drawPhysicsCue();drawParticles()}requestAnimationFrame(loop)}
resize();buildTerrain();start();requestAnimationFrame(loop);
})();
