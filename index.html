<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>JIMMY — Fast Lines, Great Stories — v117</title>
<style>
:root{
 --bg:#101319;--panel:#1b2028;--text:#f7f8fa;--muted:#d6dbe2;--accent:#f2b84b;
 --snow:#285c7a;--bike:#73563b;--board:#5a3f6f;
 --brake:#35404c;--jump:#edf0f3;--send:#f2b84b
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;justify-content:center}
#app{width:min(100vw,980px);height:100dvh;display:flex;flex-direction:column;background:#11151b}
header{flex:0 0 auto;padding:calc(7px + env(safe-area-inset-top)) 11px 7px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.title{font-weight:950;letter-spacing:.08em;font-size:clamp(18px,4vw,29px)}
.subtitle{font-size:9px;color:#c8ced6;letter-spacing:.06em}
#hud{display:flex;align-items:center;gap:9px;font-size:10px;font-weight:800;text-align:right}
#hud b{font-size:12px}
#flowHud{min-width:64px;text-align:center}
#rideState{min-width:58px;text-align:center;color:#c7cdd4}#rideState b{display:block;color:var(--accent);font-size:10px;white-space:nowrap}
#ratingHud{min-width:64px;text-align:center;color:#c7cdd4}#ratingHud b{display:block;font-size:10px;color:#e7ebef;letter-spacing:.045em;white-space:nowrap;transition:color .15s ease,text-shadow .15s ease}#ratingHud.tier1 b{color:#cfe1ea}#ratingHud.tier2 b{color:#ffd995;text-shadow:0 0 8px #f2b84b55}#ratingHud.tier3 b{color:#fff2bd;text-shadow:0 0 12px #f2b84baa}
#flowValue{display:block;color:var(--accent);font-size:11px}
.flowMini{width:58px;height:4px;margin:2px auto 0;background:#343b44;border-radius:99px;overflow:hidden}
#flowFill{height:100%;width:0;background:var(--accent);transition:width .08s linear}
#audioBtn{min-width:46px;padding:5px 7px;border:1px solid #3d4652;background:#252c35;border-radius:999px;font-size:8px;letter-spacing:.04em}
#audioBtn.muted{opacity:.55}
#alert{min-width:82px;text-align:center;background:var(--accent);color:#17130a;border-radius:999px;padding:3px 6px;font-size:8px;font-weight:950;opacity:0}
#alert.surface-read{background:#d7e6ef;color:#17232b;border:1px solid #86a8bb;box-shadow:0 0 0 1px #ffffff22,0 0 14px #8fc4df33;animation:surfaceReadPulse .48s ease-out 2}
@keyframes surfaceReadPulse{0%{transform:scale(1)}45%{transform:scale(1.055)}100%{transform:scale(1)}}
#section{min-width:92px;text-align:center;color:#f4f6f8;background:#252c35;border:1px solid #3d4652;border-radius:999px;padding:3px 7px;font-size:8px;font-weight:900;letter-spacing:.04em;transition:background .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease}#section.fast{background:#3b2d18;border-color:#b9812c;color:#ffd995;box-shadow:inset 0 0 0 1px #f2b84b22}#section.control{background:#1d3440;border-color:#557f93;color:#d8eef8;box-shadow:inset 0 0 0 1px #8cc4dc22}
.meter{width:62px;height:7px;background:#353c46;border-radius:99px;overflow:hidden;margin-top:2px}
#meterFill{height:100%;width:0;background:linear-gradient(90deg,#d8dde1,#f2b84b,#df6767)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#lineShotCard{position:absolute;right:12px;top:78px;z-index:7;width:min(188px,42vw);padding:8px 9px 9px;background:rgba(18,22,26,.91);border:1px solid #68727b;border-radius:9px;color:#f4f6f8;box-shadow:0 7px 20px rgba(0,0,0,.28);pointer-events:none;opacity:0;transform:translateY(-5px) scale(.98);transition:opacity .13s ease,transform .16s ease}
#lineShotCard.show{opacity:1;transform:translateY(0) scale(1)}
#lineShotCard.captured{border-color:#d5b46a;box-shadow:0 7px 20px rgba(0,0,0,.28),inset 0 0 0 1px rgba(213,180,106,.14)}
#lineShotCard .shotKicker{font-size:7px;font-weight:950;letter-spacing:.12em;color:#adb5bc}
#lineShotCard .shotTitle{font-size:14px;font-weight:950;line-height:1.02;margin-top:2px}
#lineShotCard .shotMeta{display:flex;justify-content:space-between;gap:8px;margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.12);font-size:7px;font-weight:850;color:#c9ced2}
#lineShotCard .shotMeta b{font-size:9px;color:#fff}
#lineShotCard .shotStatus{margin-top:4px;font-size:7px;font-weight:900;color:#d5b46a}
@media(max-width:560px){
 #lineShotCard{top:64px;right:7px;width:min(164px,47vw);padding:7px 8px}
 #lineShotCard .shotTitle{font-size:12px}
 #lineShotCard .shotMeta{font-size:6.5px}
 #lineShotCard .shotMeta b{font-size:8px}
}

#signatureTrack{position:absolute;z-index:4;top:8px;left:50%;transform:translateX(-50%);width:min(430px,72%);padding:5px 10px 6px;border:1px solid #ffffff2f;border-radius:10px;background:rgba(16,19,25,.72);box-shadow:0 5px 18px #0004;backdrop-filter:blur(5px);text-align:center;pointer-events:none;transition:opacity .18s ease,border-color .18s ease,background .18s ease}
#signatureTrack .sigLabel{font-size:7px;font-weight:900;letter-spacing:.12em;color:#cbd1d8}
#signatureTrack b{display:block;margin-top:1px;font-size:10px;line-height:1.05;letter-spacing:.07em;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#signatureTrack span{display:block;margin-top:2px;font-size:7.5px;line-height:1.05;font-weight:800;color:#eef1f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#signatureTrack.cleared{border-color:#f2b84b88;background:rgba(41,32,16,.82);box-shadow:0 5px 22px #f2b84b22}
#signatureTrack.cleared span{color:#ffd995}
#signatureTrack.pulse{animation:sigPulse .28s ease-out}
@keyframes sigPulse{0%{transform:translateX(-50%) scale(1)}45%{transform:translateX(-50%) scale(1.035);box-shadow:0 5px 26px #f2b84b55}100%{transform:translateX(-50%) scale(1)}}
canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(8,10,14,.67);backdrop-filter:blur(4px);overflow:auto}
.card{width:min(780px,96%);max-height:96%;overflow:auto;background:rgba(26,31,39,.97);border:1px solid #3b424d;border-radius:16px;padding:16px;box-shadow:0 18px 50px #0008}
.card h1,.card h2,.card h3{margin:0 0 7px}.card p{margin:7px 0;color:#e1e5ea;line-height:1.32}
.location{font-size:10px;letter-spacing:.13em;color:var(--accent);font-weight:900;margin-bottom:6px}
button{appearance:none;border:0;border-radius:12px;padding:11px 13px;font:inherit;font-weight:900;color:white;background:#303743;cursor:pointer}
button:active{transform:translateY(1px)}
.welcome-hero{position:relative;height:auto;aspect-ratio:2026/278;margin:-5px -5px 12px;overflow:hidden;border:2px solid #ffffff24;border-radius:15px;background:#07111b;box-shadow:0 14px 32px #0008}
.welcome-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center center;display:block;filter:saturate(1.08) contrast(1.04)}
.welcome-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 75%,rgba(7,12,18,.22))}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mode{position:relative;min-height:84px;overflow:hidden;border:2px solid #ffffff55;border-bottom-width:6px;text-shadow:0 2px 3px #0009;box-shadow:inset 0 2px #ffffff45,0 7px 14px #0006;transition:transform .1s,filter .1s}
.mode:before{content:'';position:absolute;inset:0;background:linear-gradient(145deg,#ffffff24,transparent 45%,#00000030);pointer-events:none}.mode:active{transform:translateY(3px);border-bottom-width:3px;filter:brightness(.92)}
#snowMode{background:linear-gradient(145deg,#20a9ef,#087acb)}#bikeMode{background:linear-gradient(145deg,#9bd14e,#528d28)}#boardMode{background:linear-gradient(145deg,#efb32f,#e76f26)}
.mode strong{position:relative;display:block;font-size:14px}.mode span{position:relative;display:block;margin-top:4px;color:#fff!important;opacity:1!important;font-size:10px;font-weight:950;letter-spacing:.08em}.modeIcon{font-size:22px!important;line-height:1;letter-spacing:.02em!important;margin:0 0 5px!important}
.secondary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.small{font-size:11px;color:#cbd1d8}
#controls{flex:0 0 auto;padding:7px max(9px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left));display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;background:#11151b;border-top:1px solid #2c323b}
#controls button{position:relative;min-height:68px;padding:31px 8px 8px;border:3px solid #111923;border-bottom-width:7px;border-radius:16px;font-size:16px;font-style:italic;letter-spacing:.025em;text-shadow:0 2px 2px #0007;touch-action:none;box-shadow:inset 0 3px #ffffff55,inset 0 -7px #00000025,0 5px 10px #0008}
#controls button:before{position:absolute;left:50%;top:5px;transform:translateX(-50%);display:block;font-style:normal;line-height:1;text-shadow:none}
#brake{background:linear-gradient(145deg,#ff5a50,#cf2628)}#brake:before{content:'';width:22px;height:22px;border:5px dotted #47181a;border-radius:50%;background:#ea3b38;box-shadow:inset 0 0 0 3px #8f2022}
#jump{background:linear-gradient(145deg,#27a9ff,#0877df);color:#fff}#jump:before{content:'↑';top:0;font-size:34px;font-weight:1000;color:#fff;filter:drop-shadow(0 2px #07529b)}
#send{background:linear-gradient(145deg,#ffc84d,#ee8b18);color:#17130a;text-shadow:0 1px #fff5}#send:before{content:'▲ ▲';top:7px;font-size:18px;letter-spacing:-6px;color:#2c2b26}
#brake.active,#jump.active,#send.active{box-shadow:inset 0 2px #ffffff33,inset 0 7px #00000025,0 2px 4px #0008;transform:translateY(3px) scale(.985);border-bottom-width:4px}
#controls button{transition:transform .08s ease,box-shadow .12s ease,background .12s ease}
.quote{font-size:16px;font-weight:850;line-height:1.25;margin:9px 0;padding:10px;border-left:4px solid var(--accent);background:#141820}.impact-card{margin:7px 0;padding:9px 10px;border:1px solid #56606d;border-radius:10px;background:linear-gradient(110deg,#20252d,#101319);font-size:11px;letter-spacing:.04em}.impact-card b{display:block;color:#f4f6f8;font-size:14px;margin-bottom:2px}.impact-card span{color:#bfc6cf}
.crash-scene{position:relative;height:86px;margin:7px 0 6px;overflow:hidden;border:1px solid #4a535e;border-radius:11px;background:#10151b;box-shadow:inset 0 1px #ffffff12}
.crash-scene svg{display:block;width:100%;height:100%}
.crash-scene .scene-copy{position:absolute;left:9px;top:7px;z-index:2;padding:3px 6px;border-radius:6px;background:rgba(8,11,15,.70);font-size:7px;font-weight:950;letter-spacing:.12em;color:#f2b84b}
.crash-scene .scene-sub{position:absolute;left:9px;bottom:7px;z-index:2;padding:3px 6px;border-radius:6px;background:rgba(8,11,15,.70);font-size:7px;font-weight:850;letter-spacing:.06em;color:#eef1f4}
.crash-scene .jimmy-settle{transform-origin:center;animation:jimmySettle .42s cubic-bezier(.2,.72,.32,1) both}
@keyframes jimmySettle{0%{transform:translate(18px,-12px) rotate(-15deg);opacity:.25}72%{transform:translate(-2px,2px) rotate(3deg);opacity:1}100%{transform:none;opacity:1}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.stat{background:#141820;padding:7px;border-radius:9px}.stat b{display:block;font-size:15px}
.result-layout{display:block}
.scoreboard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.board{background:#141820;border-radius:11px;padding:10px}.board h3{color:var(--accent)}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #282e36;font-size:11px}.row:last-child{border:0}
.run-rating{margin:7px 0;padding:8px 10px;border:1px solid #3d4652;border-radius:10px;background:#151a21}.run-rating b{color:var(--accent);font-size:15px;letter-spacing:.06em}.run-rating span{display:block;margin-top:2px;font-size:10px;color:#cbd1d8}
.share-card{position:relative;min-height:340px;overflow:hidden;margin:8px 0;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;border:2px solid #f2b84b88;border-radius:16px;background-color:#101820;background-position:center top;background-size:100% auto;background-repeat:no-repeat;box-shadow:inset 0 1px #ffffff24,0 14px 32px #0008}.share-card:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,9,15,.02) 20%,rgba(4,9,15,.35) 53%,rgba(4,9,15,.96) 100%)}.share-brand{position:relative;z-index:1;font-size:10px;font-weight:950;letter-spacing:.16em;color:#f2b84b}.share-headline{position:relative;z-index:1;margin:5px 0 10px;font-size:25px;font-weight:950;line-height:1}.share-badges{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.share-badge{padding:8px 6px;border:1px solid #ffffff28;border-radius:9px;background:#090c10cc;text-align:center;font-size:8px;color:#bfc7cf}.share-badge b{display:block;margin-top:2px;color:#fff;font-size:13px}.share-link{position:relative;z-index:1;margin-top:11px;font-size:9px;font-weight:800;color:#fff}.share-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}.share-status{min-height:16px;margin:5px 0 0;text-align:center;font-size:9px;color:#cbd1d8}
@media(max-width:600px){
 header{padding:calc(5px + env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 5px max(8px,env(safe-area-inset-left));display:grid;grid-template-columns:auto 1fr;align-items:start;gap:4px 8px}
 header>div:first-child{padding-top:2px}.title{font-size:17px;line-height:1}.subtitle{font-size:6.5px;margin-top:2px;white-space:nowrap}
 #hud{min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px 4px;font-size:7px;text-align:center;align-items:center}
 #hud b{font-size:9px}#alert,#section,#flowHud,#rideState,#ratingHud,#audioBtn{min-width:0;width:100%;padding-left:3px;padding-right:3px}
 #alert,#section{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meter{width:100%;max-width:54px;margin-left:auto;margin-right:auto}.flowMini{width:100%;max-width:48px}#flowHud{min-width:0}#rideState{min-width:0}#rideState b{font-size:8px;overflow:hidden;text-overflow:ellipsis}#ratingHud{min-width:0}#ratingHud b{font-size:8px;overflow:hidden;text-overflow:ellipsis}#audioBtn{min-width:0;padding:4px 3px;font-size:6.5px}
 #signatureTrack{top:5px;width:min(470px,86%);padding:4px 7px 5px}#signatureTrack .sigLabel{font-size:6px}#signatureTrack b{font-size:8.5px}#signatureTrack span{font-size:6.5px}
 .card{padding:11px}.card p{font-size:12px}.modes{gap:5px;margin:8px 0}.mode{min-height:65px;padding:7px 4px}.mode strong{font-size:11px}.mode span{font-size:7.5px}
 .welcome-hero{height:auto;aspect-ratio:2026/278;margin:-2px -2px 9px}.modeIcon{font-size:17px!important}
 .quote{font-size:13px;padding:7px}.stats{gap:4px}.stat{font-size:9px;padding:5px}.stat b{font-size:13px}.scoreboard{grid-template-columns:1fr}
}
@media(orientation:landscape) and (max-height:500px){
 header{padding:calc(3px + env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 3px max(8px,env(safe-area-inset-left));display:flex}.subtitle{display:none}.title{font-size:14px}#hud{font-size:7px;gap:4px}#hud b{font-size:8px}.meter{width:42px;height:5px}#flowHud{min-width:42px}.flowMini{width:38px}#audioBtn{min-width:34px;padding:3px 4px;font-size:6px}
 #signatureTrack{top:3px;width:min(500px,58%);padding:3px 6px 4px}#signatureTrack .sigLabel{display:none}#signatureTrack b{display:inline;font-size:7px;margin-right:6px}#signatureTrack span{display:inline;font-size:6px}
 #controls{padding:3px max(7px,env(safe-area-inset-right)) calc(3px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left))}#controls button{min-height:45px;font-size:9px;padding:21px 4px 4px;border-radius:11px;border-width:2px;border-bottom-width:5px}#jump:before{font-size:25px;top:-1px}#brake:before{width:15px;height:15px;border-width:3px;top:4px}#send:before{font-size:13px;top:5px}
 .card{width:97%;max-width:940px;padding:7px 9px;overflow:hidden}.card h1{font-size:18px}.card h2{font-size:15px}.card p{font-size:9px;margin:3px 0;line-height:1.12}
 .modes{margin:4px 0;gap:4px}.mode{min-height:44px;padding:4px}.mode strong{font-size:9px}.mode span{font-size:6.5px}
 .result-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:7px}.quote{font-size:10px;margin:3px 0;padding:5px}.stats{margin:0 0 3px}.stat{font-size:7px;padding:3px}.stat b{font-size:10px}
 .secondary{margin:3px 0;gap:4px}.secondary button{padding:5px;font-size:8px}.scoreboard{grid-template-columns:repeat(3,1fr);gap:5px}.board{padding:5px}.board h3{font-size:10px}.row{font-size:7px;padding:2px 0}
}

@media(max-width:600px) and (orientation:portrait){
 #overlay{align-items:flex-start;overflow:hidden;padding:4px 8px calc(76px + env(safe-area-inset-bottom))}
 #card{max-height:calc(100dvh - 148px);overflow:auto;padding:7px 8px;border-radius:11px;scrollbar-width:none}
 #card::-webkit-scrollbar{display:none}
 #card .result-actions{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:3px;margin:4px -2px -1px;padding:5px 2px 1px;background:linear-gradient(180deg,rgba(26,31,39,0),rgba(26,31,39,.97) 24%,rgba(26,31,39,.99) 100%)}
 #card .result-actions button{min-height:31px;padding:4px;font-size:9px}
 #card .crash-scene{height:66px;margin:4px 0}#card .crash-scene .scene-copy,#card .crash-scene .scene-sub{font-size:6px;padding:2px 5px}
 #card .location{font-size:7px;margin-bottom:1px}
 #card h2{font-size:18px;line-height:.95;margin:2px 0 3px}
 #card p{font-size:7px;line-height:1.12;margin:2px 0}
 #card .injury{padding:4px 6px;margin:3px 0;font-size:8px}
 #card .stats{gap:3px;margin:3px 0}
 #card .stat{padding:4px 2px;font-size:6.5px}
 #card .stat b{font-size:10px;margin-top:1px}
 #card .run-rating{margin:2px 0;padding:4px 6px}
 #card .run-rating b{font-size:10px}
 #card .run-rating span{font-size:6.5px;margin-top:1px}
 #card .secondary{gap:3px;margin-top:3px}
 #card .secondary button,#card>button{min-height:31px;padding:4px;font-size:9px}
 #card .share-card{min-height:205px;margin:2px 0;padding:8px;background-size:100% auto;background-position:center top}
 #card .share-brand{font-size:7px}.share-headline{font-size:16px!important;margin:2px 0 4px!important}
 #card .share-badges{gap:2px}.share-badge{padding:4px 2px!important;font-size:6px!important}
 #card .share-badge b{font-size:9px!important}.share-link{font-size:6.5px!important;margin-top:4px!important}
 #card .share-actions{gap:3px}.share-actions button{min-height:31px;padding:4px;font-size:8px}
 #card .share-status{font-size:6.5px;margin:1px 0 0}
}

</style>
</head>
<body>
<div id="app">
<header>
 <div><div class="title">JIMMY</div><div class="subtitle">FAST LINES. GREAT STORIES.</div></div>
 <div id="hud">
  <div id="alert">WILDLIFE</div><div id="section">CRUISE</div>
  <div>SCORE<br><b id="score">0</b></div>
  <div>SPEED<br><b id="speed">0 mph</b></div>
  <div id="flowHud">FLOW<b id="flowValue">x1.00</b><div class="flowMini"><div id="flowFill"></div></div></div>
  <div id="rideState">RIDE<b id="rideStateValue">CRUISE</b></div>
  <div id="ratingHud">RATING<b id="ratingValue">OPEN</b></div>
  <button id="audioBtn" type="button">SOUND</button>
  <div>JIMMY METER<div class="meter"><div id="meterFill"></div></div></div>
 </div>
</header>
<div id="stage"><canvas id="game"></canvas><div id="signatureTrack"><div class="sigLabel">SIGNATURE RUN</div><b id="signatureName">OBJECTIVE</b><span id="signatureProgress">READY</span></div><div id="lineShotCard" aria-live="polite"></div><div id="overlay"><div class="card" id="card"></div></div></div>
<div id="controls"><button id="brake">BRAKE</button><button id="jump">JUMP</button><button id="send">SEND IT</button></div>
</div>
<script>
(()=>{
const BUILD_VERSION='v117';

function checkLineMastery(){
 // Completing a named technical section at useful speed creates run-level progression.
 // Heavy braking can save a run, but it will not earn mastery: Jimmy has to be controlled and still carrying pace.
 const riderWx=world+player.x;
 while(nextMasteryFeature<terrainFeatures.length){
  const f=terrainFeatures[nextMasteryFeature];
  if(f.x+f.width>riderWx)break;
  nextMasteryFeature++;
  if(!f.complex||!f.label)continue;
  const choice=f.complexId!==undefined?lineChoices[f.complexId]:null;
  const baseThreshold=mode==='snow'?6.15:mode==='bike'?5.55:5.25;
  // FAST LINE is the higher-risk score route: it demands more exit speed and pays more.
  // CONTROL LINE rewards deliberate pace management: a lower speed gate, smaller award, and a little more meter recovery.
  const threshold=choice==='fast'?baseThreshold*1.08:choice==='control'?baseThreshold*.90:baseThreshold;
  if(speed>=threshold){
   masteryStreak++;
   masteredSections++;
   bestMasteryStreak=Math.max(bestMasteryStreak,masteryStreak);
   if(choice==='fast')fastLineClears++;
   if(choice==='control')controlLineClears++;
   const streakBase=220+Math.min(5,masteryStreak-1)*70;
   const styleMult=choice==='fast'?1.35:choice==='control'?.88:1;
   const label=choice==='fast'?'FAST LINE CLEAN':choice==='control'?'CONTROL LINE CLEAN':'LINE MASTERED';
   const pts=skillAward(Math.round(streakBase*styleMult),label);
   physicsCue=label+'  x'+masteryStreak+'  +'+pts;
   physicsCueTimer=1.15;
   const meterGain=choice==='control'?Math.min(10,5+masteryStreak):Math.min(8,3+masteryStreak);
   meter=Math.min(100,meter+meterGain);
  }else{
   masteryStreak=0;
   if(choice) {
    physicsCue=(choice==='fast'?'FAST LINE MISSED':'CONTROL LINE MISSED')+' · EXIT SPEED';
    physicsCueTimer=.85;
    sfx('miss');
   }
  }
 }
}

  if(braking){
   if(brakeHold<.34){
    const checkRatio=mode==='bike'?.70:mode==='snow'?.74:.78;
    target=Math.max(2.65,speed*checkRatio);
    response=6.4;
   }else{
    target=1.55;
    response=12;
   }
  }
  // Terrain now matters while Jimmy is connected to it: descents add speed, climbs scrub it;
  // braking still wins over gravity.
  target+=downhill*(braking?8:18);
  speed+=(target-speed)*Math.min(1,response*dt);
 }else{
  // Preserve takeoff momentum with only a very small passive drag. BRAKE remains useful for
  // pitch control and landing absorption; SEND IT remains useful for forward air rotation.
  const airDrag=mode==='bike'?.035:mode==='snow'?.028:.024;
  speed-=airDrag*dt;
 }
 speed=Math.max(1.35,Math.min(11.1,speed));

 // v101 higher-refinement gameplay physics: actively pump authored compressions.
 // Jimmy is an experienced rider, so holding SEND IT through the bottom of a bowl/gully/dip
 // converts some vertical compression into exit speed. This is a one-shot terrain interaction,
 // not a generic turbo: it only resolves near the bottom of the authored feature.
 if(player.onGround&&sendIt&&!braking){
  const pumpFeature=currentFeature(wx);
  if(pumpFeature&&['bowl','gully','dip'].includes(pumpFeature.kind)&&!pumpFeature.pumpDone){
   const pumpU=(wx-pumpFeature.x)/pumpFeature.width;
   if(pumpU>=.43&&pumpU<=.57){
    pumpFeature.pumpDone=true;
    const entryFactor=Math.max(0,Math.min(1,(speed-3.8)/5.2));
    const pumpBoost=(mode==='bike'?.34:mode==='snow'?.29:.25)+entryFactor*.14;
    const beforePump=speed;
    speed=Math.min(11.1,speed+pumpBoost);
    const gained=Math.max(0,speed-beforePump);
    if(gained>.03){
     stability=Math.min(100,stability+4);

     physicsCueTimer=.82;
     sfx('pump');

   }
  }
 }

 // v47 high-speed stability: sharp terrain transitions load the edge/front end/trucks.
 // Jimmy can carry serious speed, but entering a technical compression or direction change
 // unprepared now has a consequence. Braking and a prepared line actively restore stability.
 if(player.onGround){
  const slopeBack=terrainSlopeAt(wx-36), slopeAhead=terrainSlopeAt(wx+64);
  const transitionLoad=Math.min(.62,Math.abs(slopeAhead-slopeBack));
  const modeThreshold=mode==='snow'?6.65:mode==='bike'?6.35:6.15;
  const excess=Math.max(0,speed-modeThreshold);
  const load=Math.max(0,(transitionLoad-.075))*excess*(sendIt?1.30:1);
  if(load>0){
   const prepared=Math.min(.82,lineSet*.55+(braking?.42:0));

  }else stability+=dt*(braking?34:18);
  if(braking)stability+=dt*(brakeHold<.34?13:24);

  }

  if(stability<=0){
   crash({type:mode==='snow'?'edgewash':mode==='bike'?'frontload':'wobble'});

  }
 }else stability=Math.min(100,stability+dt*9);

 world+=speed*60*dt;
 checkLineMastery();

 if(sendIt){meter=Math.min(100,meter+dt*4.7);score+=dt*42}
 else if(braking)meter=Math.max(0,meter-dt*5.8);
 else meter=Math.max(0,meter-dt*1.15);

 // Experienced line-setting: a short brake set before takeoff trades entry speed for landing precision.
 if(player.onGround&&braking&&!sendIt&&speed>2.2){

 }else if(player.onGround&&!braking){

  if(lineSet<.5)lineSetReady=false;
 }

 score+=dt*12*speed/6;
 if(world>nextSpawn)spawn();

 let gy=groundY(player.x)-player.h;
 const surfaceAngle=terrainAngleAt(world+player.x);

 if(!player.onGround){
  // v109 higher-refinement air physics: vertical translation is now refresh-rate independent.
  // player.vy intentionally keeps the established 60 Hz tuning units, so dt*60 preserves the
  // current jump feel at 60 Hz while making 90/120 Hz phones follow the same trajectory.
  const airFrameScale=dt*60;
  player.vy+=28*dt;
  player.y+=player.vy*airFrameScale;
  airTime+=dt;totalAir+=dt;

  // v93 higher-refinement air physics: attitude control is time-based rather than frame-based.
  // This keeps SEND IT, BRAKE, and neutral rotation consistent across 60/90/120 Hz phones and desktops.

  const airRotRate=sendIt?2.4:braking?-1.5:.6;

  // v61 landing absorption: an experienced rider can hold BRAKE on final descent to absorb a rough touchdown.
  // It does not erase a bad line; it gently matches the landing surface and trades a little exit speed for control.
  const landingDistance=gy-player.y;
  let absorbingLanding=false;
  if(braking&&player.vy>1.8&&landingDistance>=0&&landingDistance<58){
   absorbingLanding=true;
   const absorb=Math.max(0,1-landingDistance/58);

   const delta=((desired-player.rot+Math.PI*3)%(Math.PI*2))-Math.PI;

   // high-speed, badly misaligned touchdown becomes an immediate crash.

   player.y=gy;

   if(roughLanding){
    const severity=Math.min(1,(effectiveLandingError-.72)/.66);

   const flowLanding=airTime>.32&&landingSlope>.055&&impactVy>2.2&&landingCleanliness>.35;
   const cleanLandingSound=airTime>.32&&landingCleanliness>.72&&impactVy>3.0;
   // v111 Jimmy & animation: preserve the character of the touchdown for a short grounded
   // recovery sequence. Visual-only state: scoring, speed, stability and landing rules are untouched.
   landingRecoveryTimer=.52;
   landingRecoveryKind=roughLanding?'rough':landingAbsorb?'absorb':flowLanding?'flow':'clean';

   // actually rides its launch and exits the landing with useful pace and composure.
   // A deliberate BRAKE absorption is valid; a rough save is not.

    const transferClean=!roughLanding&&landingCleanliness>=.56&&stability>=68&&speed>=transferMinSpeed;

    lastAutoLaunch=world;lastAutoLaunchTime=performance.now();jumpTapCount=0;airTrick='';rampLaunch=true;

    activeExpertTransfer=rampFeature.label===expertLaunch?expertLaunch:'';
    physicsCue=sendIt?'RAMP POP · SEND IT':prepared>.55?'RAMP POP · LINE SET':'RAMP POP';
    physicsCueTimer=.72;
   }
  }
  if(!rampLaunch&&speed>5.2 && world-lastAutoLaunch>230 && (fallAway>15 || crest>.22)){
   activeExpertTransfer='';
   airLineSet=lineSet;lineSet=0;lineSetReady=false;
   player.onGround=false;
   player.vy=Math.min(-2.2,-speed*.42 + surfaceAngle*2.5);
   lastAutoLaunch=world;lastAutoLaunchTime=performance.now();jumpTapCount=0;airTrick='';
  }
 }

 let nearLabel='',surfacePrompt=false;
 for(const o of obstacles){
  let sx=o.wx-world;
  updateEncounterBehavior(o,sx,dt);updateMaintenanceBehavior(o,sx,dt);updateExpertSpotterBehavior(o,sx,dt);

    meter=Math.min(100,meter+5);

    physicsCueTimer=.95;tone(330,.05,'triangle',.018,40);

   }
  }
  if(sx<W*.82&&sx>player.x+70){
   if(o.type==='lion')nearLabel='MOUNTAIN LION';
   else if(o.type==='bear')nearLabel='BLACK BEAR';
   else if(o.type==='skier')nearLabel='SKIER AHEAD';

   else if(o.type==='workzone')nearLabel='MOUNTAIN OPS';
   else if(o.type==='trailwork')nearLabel='TRAIL WORK';
   else if(o.type==='drivewayout')nearLabel='ACTIVE DRIVEWAY';
   else if(o.type==='snowwarning')nearLabel='CHOP · BRAKE / SET';
   else if(o.type==='gravelwarning')nearLabel='GRAVEL · BRAKE / SET';
   else if(o.type==='roughroad')nearLabel='ROUGH · BRAKE / SET';
   else if(o.type==='snowchop')nearLabel='CHOPPED SNOW';
   else if(o.type==='loosegravel')nearLabel='LOOSE GRAVEL';
   else if(o.type==='brokenasphalt')nearLabel='ROUGH ASPHALT';
   else if(o.type==='retroboard')nearLabel='RETRO JIMMY WAS HERE';
   else if(o.type==='garagebike')nearLabel='JIMMY\'S TRAILHEAD';
   else if(o.type==='miatasign')nearLabel='MIATA COUNTRY';
   else if(o.type==='parkrail')nearLabel='PARK RAIL';
   else if(o.type==='roots')nearLabel='ROOTS';
   else if(o.type==='roadpatch')nearLabel='ROAD PATCH';
   if(nearLabel&&o.lineChoice&&!o.wildlife&&!o.event&&!surfaceWarning)nearLabel=(o.lineChoice==='fast'?'FAST LINE · ':'CONTROL LINE · ')+nearLabel;
  }
  const terrainLaunchProp=o.type==='kicker'||o.type==='ramp'||o.type==='tabletop';
  if(!terrainLaunchProp&&!o.decor&&!o.hit&&player.x+player.w-5>sx&&player.x+5<sx+o.w&&player.y+player.h-4>oy&&player.y+7<oy+o.h){

function pumpTransferLightingPass(){
 // v108 mobile QA: keep the v104 signature-line lighting visually identical while removing
 // the two Set allocations + filtered array allocation that were happening every rendered frame.
 // This pass now scans terrainFeatures in place and allocates no temporary feature collections.
 let hasVisible=false;
 for(const f of terrainFeatures){
  const label=f.label;
  const relevant=label==='COMPRESSION BOWL'||label==='GULLY DIP'||label==='ROAD COMPRESSION'||
                 label==='BOWL EXIT KICKER'||label==='GULLY EXIT LIP'||label==='DIP EXIT LAUNCH';
  if(!relevant)continue;
  const sx=f.x-world;
  if(sx+f.width>-90&&sx<W+90){hasVisible=true;break}
 }
 if(!hasVisible)return;

 ctx.save();
 // Keep all lighting tied to the riding surface instead of washing over sky/HUD.
 ctx.beginPath();ctx.moveTo(0,H);
 for(let x=0;x<=W+20;x+=14)ctx.lineTo(x,groundY(x));
 ctx.lineTo(W,H);ctx.closePath();ctx.clip();

 const pace=Math.max(.72,Math.min(1.28,speed/6.2));
 for(const f of terrainFeatures){
  const label=f.label;
  const compression=label==='COMPRESSION BOWL'||label==='GULLY DIP'||label==='ROAD COMPRESSION';
  const launch=label==='BOWL EXIT KICKER'||label==='GULLY EXIT LIP'||label==='DIP EXIT LAUNCH';
  if(!compression&&!launch)continue;
  const sx=f.x-world, ex=sx+f.width;
  if(ex<=-90||sx>=W+90)continue;

  if(compression){
   // A soft "loaded" trough shadow: cold blue in snow, earthy in OC, cool asphalt in SoCal.
   const shade=mode==='snow'?'rgba(62,106,137,.20)':mode==='bike'?'rgba(62,43,29,.20)':'rgba(28,34,39,.22)';
   ctx.strokeStyle=shade;ctx.lineWidth=13;ctx.lineCap='round';
   ctx.beginPath();
   for(let x=Math.max(-20,sx);x<=Math.min(W+20,ex);x+=18){
    const y=groundY(x)+7;
    x<=sx+18?ctx.moveTo(x,y):ctx.lineTo(x,y);
   }
   ctx.stroke();

   // Compression-center depth band moves subtly with speed, selling contour without UI arrows.
   const center=sx+f.width*.50;
   const glowW=Math.min(88,f.width*.22);
   const g=ctx.createRadialGradient(center,groundY(center)+9,4,center,groundY(center)+9,glowW);
   if(mode==='snow'){
    g.addColorStop(0,'rgba(113,164,192,.19)');g.addColorStop(1,'rgba(113,164,192,0)');
   }else if(mode==='bike'){
    g.addColorStop(0,'rgba(91,59,37,.18)');g.addColorStop(1,'rgba(91,59,37,0)');
   }else{
    g.addColorStop(0,'rgba(19,24,28,.20)');g.addColorStop(1,'rgba(19,24,28,0)');
   }
   ctx.fillStyle=g;ctx.fillRect(center-glowW,groundY(center)-18,glowW*2,62);
  }else{
   // Exit lip catches light: crisp alpine edge, warm dusty OC edge, sunset road sheen.
   const hi=mode==='snow'?'rgba(220,245,255,.58)':mode==='bike'?'rgba(242,191,119,.42)':'rgba(255,215,174,.34)';
   ctx.strokeStyle=hi;ctx.lineWidth=3.2;ctx.lineCap='round';
   ctx.beginPath();
   for(let x=Math.max(-20,sx);x<=Math.min(W+20,ex);x+=14){
    const y=groundY(x)+2;
    x<=sx+14?ctx.moveTo(x,y):ctx.lineTo(x,y);
   }
   ctx.stroke();

   // Sparse environment-specific release detail near the lip.
   const lipX=ex-20;
   ctx.globalAlpha=.18+.06*pace;
   if(mode==='snow'){
    ctx.strokeStyle='#f5fbff';ctx.lineWidth=1.3;
    for(let i=0;i<5;i++){
     const x=lipX-32+i*13, y=groundY(Math.max(0,Math.min(W,x)))-4-(i%2)*3;
     ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+15+pace*5,y-2);ctx.stroke();
    }
   }else if(mode==='bike'){
    ctx.fillStyle='#d9a46b';
    for(let i=0;i<5;i++){
     const x=lipX-28+i*14, y=groundY(Math.max(0,Math.min(W,x)))+5;
     ctx.beginPath();ctx.ellipse(x,y,5+(i%2)*2,1.5,0,0,Math.PI*2);ctx.fill();
    }
   }else{
    ctx.strokeStyle='#f0c39a';ctx.lineWidth=1.2;
    for(let i=0;i<4;i++){
     const x=lipX-24+i*18, y=groundY(Math.max(0,Math.min(W,x)))+4;
     ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+18,y-1);ctx.stroke();
    }
   }
   ctx.globalAlpha=1;
  }
 }
 ctx.restore();
}

function dynamicAtmospherePass(){
 // v43 environment-graphics pass: moving atmospheric detail that reinforces place and speed without affecting gameplay.
 ctx.save();
 const t=performance.now()*.001;
 if(mode==='snow'){
  // Fine windblown powder and occasional longer gusts; all screen-space and non-collidable.
  ctx.lineCap='round';
  for(let i=0;i<34;i++){
   const seed=i*37.17;
   const drift=(world*.22 + t*(34+(i%5)*7) + seed*19)%(W+120)-60;
   const y=H*.18 + ((seed*29)%Math.max(80,H*.60));
   const len=7+(i%6)*3;
   ctx.globalAlpha=.11+(i%4)*.035;
   ctx.strokeStyle='#ffffff';ctx.lineWidth=1+(i%3)*.35;
   ctx.beginPath();ctx.moveTo(drift,y);ctx.lineTo(drift-len,y+2.5);ctx.stroke();
  }

   // SEND IT in the air: shoulders lead down-course and the rear arm trails, matching the forward pitch input.
   limb(-1,shoulderY,-13,shoulderY+7,4);limb(0,shoulderY,18,shoulderY-8,4);
  }else if(airBack){
   // BRAKE in the air: chest opens and both arms rise slightly as Jimmy checks the rotation.
   limb(-1,shoulderY,-17,shoulderY-7,4);limb(0,shoulderY,14,shoulderY-9,4);
  }else if(airborne&&airTime>.38){
   limb(-1,shoulderY,-12,shoulderY+4,4);limb(-12,shoulderY+4,-16,21-tweak*.2,3.6);
   limb(0,shoulderY,15,shoulderY-5-tweak*.3,4);
  }else if(recoveryActive){
   if(landingRecoveryKind==='rough'){
    // One quick corrective sweep, then back to neutral: Jimmy rides it out rather than rag-dolling.
    limb(-1,shoulderY,-18-recoveryCorrection*5,shoulderY-3-recoveryCorrection*4,4);
    limb(0,shoulderY,16+recoveryCorrection*4,shoulderY+6,4);
   }else if(landingRecoveryKind==='absorb'){
    limb(-1,shoulderY,-13,shoulderY+7-recoveryAbsorb*3,4);
    limb(0,shoulderY,14,shoulderY+6-recoveryAbsorb*2,4);
   }else{
    limb(-1,shoulderY,-14-recoveryFlow*2,shoulderY+3-recoveryFlow*5,4);
    limb(0,shoulderY,15+recoveryFlow*4,shoulderY+2-recoveryFlow*7,4);
   }
  }else if(pumpLoad>.05||pumpRelease>.05){
   const drive=pumpRelease;
   limb(-1,shoulderY,-12-drive*3,shoulderY+5-drive*6,4);
   limb(0,shoulderY,12+drive*5,shoulderY+3-drive*8,4);
  }else{
   const spread=brakePose?17:sendPose?12:20;
   limb(-1,shoulderY,-spread,shoulderY+(carve*4),4);limb(0,shoulderY,spread-2,shoulderY-(carve*3),4);
  }
  // knees visibly absorb landings; bindings anchor the feet to the deck
  limb(-2,hipY,-13,18+crouch*.18,4.2);limb(-13,18+crouch*.18,-14,24,4.2);
  limb(-1,hipY,11,18+crouch*.12,4.2);limb(11,18+crouch*.12,13,23,4.2);
  const flex=player.onGround?(1.4+landingSquash*3.4):(.4+airStyle*.8);
  ctx.strokeStyle=ink;ctx.lineWidth=retroSnow?6.2:5;ctx.beginPath();ctx.moveTo(retroSnow?-33:-29,26+tweak*.08);ctx.quadraticCurveTo(0,26+flex,retroSnow?34:31,24-tweak*.10);ctx.stroke();
  if(retroSnow){ctx.strokeStyle='#d45d8f';ctx.lineWidth=2.3;ctx.beginPath();ctx.moveTo(-28,24.5);ctx.lineTo(29,23);ctx.stroke()}
  ctx.strokeStyle=retroSnow?'#f0cf58':accent;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-17,24);ctx.lineTo(-12,19);ctx.moveTo(15,23);ctx.lineTo(10,18);ctx.stroke();

 }else if(mode==='bike'){
  // MTB: elbows and knees stay active, body moves independently from the bike, suspension compresses on impact.
  const compression=squash*1.05+(brakePose?2.6:0)+(linePose?1.2:0)+(preload*4.2)+(pumpLoad*5.8)-(pumpRelease*1.8)+(recoveryLoad*3.2)-(recoveryFlow*1.8)-(recoveryAbsorb*.5)+(airLanding?3.2:0);
  const rear={x:-16,y:25},front={x:20,y:25};
  const bikePitch=airborne?Math.max(-.08,Math.min(.08,-player.vy*.004)):0;
  ctx.save();ctx.rotate(bikePitch);
  ctx.strokeStyle=ink;ctx.lineWidth=3;
  for(const w of [rear,front]){ctx.save();ctx.translate(w.x,w.y);ctx.rotate(wheelSpin);ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1.25;for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.stroke();ctx.rotate(Math.PI/6)}ctx.restore()}
  const crankY=11+compression*.28;
  ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(rear.x,rear.y);ctx.lineTo(0,crankY);ctx.lineTo(front.x,front.y);ctx.lineTo(rear.x,rear.y);ctx.moveTo(0,crankY);ctx.lineTo(12,8+compression*.12);ctx.lineTo(18,7);ctx.stroke();
  ctx.restore();
  const hipX=airLanding?-4:airForward?4:airBack?-6:airborne?-1:brakePose?-5:sendPose?4:1;
  const pumpHipDrive=pumpRelease*3.8-pumpLoad*1.2;
  const recoveryDrive=recoveryFlow*3.0-recoveryCorrection*1.4;
  const hipY=7+compression*.34, shoulderX=(airForward?8:airBack?-2:sendPose?7:brakePose?-2:4)+pumpHipDrive+recoveryDrive, shoulderY=-8+compression*.22;
  head(shoulderX+1,-20+compression*.18,7.6);
  limb(shoulderX, -12+compression*.18, shoulderX, shoulderY,4.5);torso(shoulderX,shoulderY,hipX,hipY,4.8);
  // both hands stay on bars; elbows flare more under braking and in rough landings
  const elbowDrop=(airLanding?6:airBack?7:airForward?1:brakePose?7:airborne?2:4)+(recoveryCorrection*4.2)+(recoveryAbsorb*1.8)-(recoveryFlow*1.2);
  limb(shoulderX,shoulderY,11,shoulderY+elbowDrop,4);limb(11,shoulderY+elbowDrop,18,7,3.8);
  limb(shoulderX-1,shoulderY,-4,shoulderY+elbowDrop+1,4);limb(-4,shoulderY+elbowDrop+1,15,7,3.8);
  // pedals / knees
  limb(hipX,hipY,-8,16+compression*.18,4.2);limb(-8,16+compression*.18,-1,20,4.1);
  limb(hipX,hipY,8,15+compression*.12,4.2);limb(8,15+compression*.12,2,20,4.1);

 }else{
  // Longboard: SEND IT becomes a compact speed tuck; braking reads as a deliberate speed-check carve.
  const tuck=sendPose?1:0;
  const check=brakePose?1:0;
  const crouch=2+squash+(tuck*6)+(check*3)+(linePose*1.5)+(preload*4.6)+(pumpLoad*4.9)-(pumpRelease*2.5)+(recoveryLoad*3.0)-(recoveryFlow*2.0)-(recoveryAbsorb*.6)+(airLanding?4.0:0);
  const bank=player.onGround?carve*.10*pace*(check?1.75:1):0;
  ctx.rotate(bank);
  const hipY=9+crouch*.55, shoulderY=-6+crouch*.35, headY=-18+crouch*.38;
  head(tuck?5:1,headY,7.8);
  limb(tuck?4:0,headY+8,tuck?5:0,shoulderY,4.5);torso(tuck?5:0,shoulderY,0,hipY,4.8);
  if(airLanding){
   // Landing-ready: shoulders square, arms lower, knees already loaded for impact.
   limb(0,shoulderY,-12,shoulderY+7,4);limb(1,shoulderY,13,shoulderY+7,4);
  }else if(airForward){
   // Forward pitch: compact, directional posture rather than a generic airborne silhouette.
   limb(0,shoulderY,-8,shoulderY+7,4);limb(1,shoulderY,16,shoulderY-7,4);
  }else if(airBack){
   // Rotation check: arms open and slightly high while the knees stay loaded beneath him.
   limb(0,shoulderY,-18,shoulderY-8,4);limb(1,shoulderY,17,shoulderY-5,4);
  }else if(recoveryActive){
   if(landingRecoveryKind==='rough'){
    // A quick counter-sweep communicates truck correction without making Jimmy look out of control.
    limb(0,shoulderY,-18-recoveryCorrection*5,shoulderY-7,4);
    limb(1,shoulderY,19+recoveryCorrection*4,shoulderY+5,4);
   }else if(landingRecoveryKind==='absorb'){
    limb(0,shoulderY,-12,shoulderY+8-recoveryAbsorb*3,4);
    limb(1,shoulderY,13,shoulderY+7-recoveryAbsorb*2,4);
   }else{
    limb(0,shoulderY,-10-recoveryFlow*2,shoulderY+5-recoveryFlow*4,4);
    limb(1,shoulderY,14+recoveryFlow*4,shoulderY-recoveryFlow*6,4);
   }
  }else if(tuck){
   // forearms stay compact; on pump release the lead arm reaches slightly forward with the extension.
   limb(4,shoulderY,10+pumpRelease*5,5-pumpRelease*4,4);
   limb(0,shoulderY,-4+pumpRelease*2,6-pumpRelease*3,4);
  }else if(check){
   // arms open during a controlled speed check; Jimmy remains composed.
   limb(0,shoulderY,-18,shoulderY-5,4);limb(1,shoulderY,18,shoulderY+4,4);
  }else{
   limb(0,shoulderY,-13,shoulderY+carve*3,4);limb(1,shoulderY,14,shoulderY-carve*3,4);
  }
  limb(0,hipY,-14,18+crouch*.10,4.2);limb(-14,18+crouch*.10,-17,24,4.1);
  limb(0,hipY,13,18+crouch*.08,4.2);limb(13,18+crouch*.08,17,24,4.1);
  const boardFlex=player.onGround?(1+landingSquash*2.8):.5;
  ctx.strokeStyle=ink;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-28,25);ctx.quadraticCurveTo(0,27+boardFlex,30,25);ctx.stroke();
  ctx.fillStyle='#202328';for(const wx of [-19,21]){ctx.save();ctx.translate(wx,29);ctx.rotate(wheelSpin*1.5);ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();ctx.restore()}
 }
 ctx.restore()
}

function drawCrashPlayer(progress,hit){
 // v49 Jimmy & animation: crashes now read differently by sport instead of using one generic pinwheel.
 // Visual-only choreography: no collision, scoring, speed, or recovery rules are changed.
 const t=Math.max(0,Math.min(1,progress));
 const ease=1-Math.pow(1-t,2);
 ctx.save();
 ctx.translate(player.x+18,player.y+26);
 const ink='#171a20',skin='#d6a06f',blue='#315f83',gear='#252b32',accent='#f2b84b';
 function L(x1,y1,x2,y2,w=4,c=ink){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
 function H(x,y,r=7.5){ctx.fillStyle=skin;ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#b59a6a';ctx.beginPath();ctx.arc(x,y-2,r*.8,Math.PI,Math.PI*2);ctx.fill()}
 if(mode==='snow'){
  // Snow: edge catches, board comes across the fall line, Jimmy separates into a compact shoulder roll.
  const r=-.18+ease*1.55;ctx.rotate(r);
  const sep=Math.max(0,(t-.32))*34;
  H(3,-19+sep*.18);L(2,-11,-1,7,5,blue);
  L(-1,0,-16,-6-sep*.15,4);L(0,0,15,7+sep*.10,4);
  L(-1,7,-13,20,4);L(-1,7,13,18,4);
  ctx.save();ctx.translate(0,sep);ctx.rotate(.25+ease*.9);ctx.strokeStyle=ink;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-30,25);ctx.quadraticCurveTo(0,28,31,24);ctx.stroke();ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-15,24);ctx.lineTo(-10,19);ctx.moveTo(14,23);ctx.lineTo(9,18);ctx.stroke();ctx.restore();
 }else if(mode==='bike'){
  // MTB: front-end event pitches the bike first; Jimmy goes over it rather than rotating as one rigid unit.
  const bodyRot=ease*1.25;ctx.rotate(bodyRot);
  const bikeDrop=Math.max(0,t-.24)*22;
  ctx.save();ctx.translate(-3,bikeDrop);ctx.rotate(ease*.95);
  ctx.strokeStyle=ink;ctx.lineWidth=3;for(const wx of [-16,20]){ctx.beginPath();ctx.arc(wx,25,11,0,Math.PI*2);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(-16,25);ctx.lineTo(0,11);ctx.lineTo(20,25);ctx.lineTo(-16,25);ctx.moveTo(0,11);ctx.lineTo(14,7);ctx.stroke();ctx.restore();
  H(7,-19);L(6,-11,1,6,5,blue);L(2,-5,-13,-1,4);L(3,-5,18,-8,4);L(1,6,-11,17,4);L(1,6,14,16,4);
 }else{
  // Longboard: trucks start to oscillate, board shoots ahead, Jimmy steps out before the tumble develops.
  const wobble=Math.sin(t*26)*(1-t)*.18;ctx.rotate(wobble+ease*.85);
  const boardShoot=ease*44;
  H(1,-19);L(1,-11,-1,7,5,blue);L(0,-3,-16,-8,4);L(0,-3,17,1,4);L(-1,7,-13,19,4);L(-1,7,15,21,4);
  ctx.save();ctx.translate(boardShoot,5);ctx.rotate(ease*.28);ctx.strokeStyle=ink;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-28,25);ctx.quadraticCurveTo(0,27,30,25);ctx.stroke();ctx.fillStyle=gear;for(const wx of [-19,21]){ctx.beginPath();ctx.arc(wx,29,4,0,Math.PI*2);ctx.fill()}ctx.restore();
 }
 ctx.restore();
}

function drawCrashXray(progress,hit){
 // v85 Jimmy & animation: a short, stylized "impact scan" flashes through Jimmy during a crash.
 // It is visual-only: no physics, collision, scoring, or recovery behavior is changed.
 const t=Math.max(0,Math.min(1,progress));
 if(t<.10||t>.56)return;
 const q=(t-.10)/.46;
 const pulse=Math.sin(q*Math.PI);
 const jitter=Math.sin(q*42)*.7*pulse;

 ctx.save();
 ctx.globalCompositeOperation='screen';
 ctx.translate(player.x+18+jitter,player.y+26-jitter*.4);

 // Match the broad body rotation used by the sport-specific crash pose.
 if(mode==='snow')ctx.rotate(-.18+(1-Math.pow(1-t,2))*1.55);
 else if(mode==='bike')ctx.rotate((1-Math.pow(1-t,2))*1.25);
 else ctx.rotate(Math.sin(t*26)*(1-t)*.18+(1-Math.pow(1-t,2))*.85);

 ctx.globalAlpha=.88*pulse;
 ctx.shadowColor='rgba(190,238,255,.95)';
 ctx.shadowBlur=12+18*pulse;
 ctx.strokeStyle='rgba(220,247,255,.96)';
 ctx.fillStyle='rgba(205,241,255,.16)';
 ctx.lineCap='round';
 ctx.lineJoin='round';

 // Soft scan plate behind the bones.
 ctx.beginPath();ctx.ellipse(0,0,27,41,0,0,Math.PI*2);ctx.fill();

 // Skull and jaw.
 ctx.lineWidth=2.4;
 ctx.beginPath();ctx.arc(3,-19,7.2,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-1,-14);ctx.lineTo(6,-12);ctx.lineTo(9,-16);ctx.stroke();

 // Spine and pelvis.
 ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(2,-11);ctx.quadraticCurveTo(-1,-2,0,8);ctx.stroke();
 ctx.beginPath();ctx.arc(0,8,7,0.15,Math.PI-.15);ctx.stroke();

 // Ribs.
 ctx.lineWidth=1.8;
 for(let i=0;i<4;i++){
  const y=-8+i*4.2, w=9.5-i*.9;
  ctx.beginPath();ctx.ellipse(1,y,w,3.7,0,0,Math.PI*2);ctx.stroke();
 }

 // Limbs use the same general crash pose, with sport-specific separation.
 let armL=[-1,-4,-15,-7],armR=[2,-4,16,3],legL=[0,8,-13,20],legR=[0,8,14,19];
 if(mode==='bike'){armL=[1,-5,-14,-1];armR=[3,-5,18,-8];legL=[0,7,-12,18];legR=[0,7,15,17]}
 if(mode==='board'){armL=[0,-4,-16,-8];armR=[1,-4,17,1];legL=[0,8,-13,20];legR=[0,8,15,21]}
 ctx.lineWidth=3;
 for(const b of [armL,armR,legL,legR]){
  ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[2]*.52+(b[0]*.48),b[3]*.52+(b[1]*.48));ctx.lineTo(b[2],b[3]);ctx.stroke();
 }

 // Joint highlights make the scan readable at phone scale.
 ctx.fillStyle='rgba(235,251,255,.98)';
 for(const p of [[2,-11],[0,8],[-7,-6],[9,-1],[-7,14],[8,14]]){
  ctx.beginPath();ctx.arc(p[0],p[1],1.7,0,Math.PI*2);ctx.fill();
 }

 // Impact locator varies with crash cause so the flash feels diagnostic rather than random.
 let ix=0,iy=10;
 if(hit==='landing'){ix=0;iy=18}
 else if(hit==='edgewash'){ix=-10;iy=15}
 else if(hit==='frontload'){ix=10;iy=-4}
 else if(hit==='wobble'){ix=-2;iy=7}
 else if(hit==='rock'||hit==='log'||hit==='curb'){ix=8;iy=9}
 const ring=6+10*q;
 ctx.strokeStyle=`rgba(255,255,255,${.9*pulse})`;
 ctx.lineWidth=2.4;
 ctx.beginPath();ctx.arc(ix,iy,ring,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.moveTo(ix-ring-4,iy);ctx.lineTo(ix+ring+4,iy);ctx.moveTo(ix,iy-ring-4);ctx.lineTo(ix,iy+ring+4);ctx.stroke();

 ctx.restore();

 // Brief full-screen scan line, restrained enough not to obscure play or trigger continuously.
 ctx.save();
 ctx.globalAlpha=.16*pulse;
 const scanY=player.y+player.h*(.25+.55*q);
 const grad=ctx.createLinearGradient(0,scanY-8,0,scanY+8);
 grad.addColorStop(0,'rgba(210,246,255,0)');
 grad.addColorStop(.5,'rgba(230,252,255,1)');
 grad.addColorStop(1,'rgba(210,246,255,0)');
 ctx.fillStyle=grad;ctx.fillRect(0,scanY-8,W,16);
 ctx.restore();
}

function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/70);ctx.fillStyle=mode==='snow'?'#fff':mode==='bike'?'#d6ad79':'#bbb';ctx.fillRect(p.x,p.y,5,5);p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.life--}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0)}

let last=performance.now();
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;if(running)update(dt);if(!ended||running||introActive){drawScene();if(introActive){drawLocationIntro(now)}else{brakeSpray();drawPlayer();drawPhysicsCue();drawParticles()}}requestAnimationFrame(loop)}
resize();buildTerrain();start();requestAnimationFrame(loop);
})();
