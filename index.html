<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>JIMMY — Fast Lines, Great Stories — v77</title>
<style>
:root{
 --bg:#101319;--panel:#1b2028;--text:#f7f8fa;--muted:#d6dbe2;--accent:#f2b84b;
 --snow:#285c7a;--bike:#73563b;--board:#5a3f6f;
 --brake:#35404c;--jump:#edf0f3;--send:#f2b84b
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;justify-content:center}
#app{width:min(100vw,980px);height:100dvh;display:flex;flex-direction:column;background:#11151b}
header{flex:0 0 auto;padding:calc(7px + env(safe-area-inset-top)) 11px 7px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.title{font-weight:950;letter-spacing:.08em;font-size:clamp(18px,4vw,29px)}
.subtitle{font-size:9px;color:#c8ced6;letter-spacing:.06em}
#hud{display:flex;align-items:center;gap:9px;font-size:10px;font-weight:800;text-align:right}
#hud b{font-size:12px}
#flowHud{min-width:64px;text-align:center}
#rideState{min-width:58px;text-align:center;color:#c7cdd4}#rideState b{display:block;color:var(--accent);font-size:10px;white-space:nowrap}
#ratingHud{min-width:64px;text-align:center;color:#c7cdd4}#ratingHud b{display:block;font-size:10px;color:#e7ebef;letter-spacing:.045em;white-space:nowrap;transition:color .15s ease,text-shadow .15s ease}#ratingHud.tier1 b{color:#cfe1ea}#ratingHud.tier2 b{color:#ffd995;text-shadow:0 0 8px #f2b84b55}#ratingHud.tier3 b{color:#fff2bd;text-shadow:0 0 12px #f2b84baa}
#flowValue{display:block;color:var(--accent);font-size:11px}
.flowMini{width:58px;height:4px;margin:2px auto 0;background:#343b44;border-radius:99px;overflow:hidden}
#flowFill{height:100%;width:0;background:var(--accent);transition:width .08s linear}
#audioBtn{min-width:46px;padding:5px 7px;border:1px solid #3d4652;background:#252c35;border-radius:999px;font-size:8px;letter-spacing:.04em}
#audioBtn.muted{opacity:.55}
#alert{min-width:82px;text-align:center;background:var(--accent);color:#17130a;border-radius:999px;padding:3px 6px;font-size:8px;font-weight:950;opacity:0}
#section{min-width:92px;text-align:center;color:#f4f6f8;background:#252c35;border:1px solid #3d4652;border-radius:999px;padding:3px 7px;font-size:8px;font-weight:900;letter-spacing:.04em;transition:background .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease}#section.fast{background:#3b2d18;border-color:#b9812c;color:#ffd995;box-shadow:inset 0 0 0 1px #f2b84b22}#section.control{background:#1d3440;border-color:#557f93;color:#d8eef8;box-shadow:inset 0 0 0 1px #8cc4dc22}
.meter{width:62px;height:7px;background:#353c46;border-radius:99px;overflow:hidden;margin-top:2px}
#meterFill{height:100%;width:0;background:linear-gradient(90deg,#d8dde1,#f2b84b,#df6767)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}

#signatureTrack{position:absolute;z-index:4;top:8px;left:50%;transform:translateX(-50%);width:min(430px,72%);padding:5px 10px 6px;border:1px solid #ffffff2f;border-radius:10px;background:rgba(16,19,25,.72);box-shadow:0 5px 18px #0004;backdrop-filter:blur(5px);text-align:center;pointer-events:none;transition:opacity .18s ease,border-color .18s ease,background .18s ease}
#signatureTrack .sigLabel{font-size:7px;font-weight:900;letter-spacing:.12em;color:#cbd1d8}
#signatureTrack b{display:block;margin-top:1px;font-size:10px;line-height:1.05;letter-spacing:.07em;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#signatureTrack span{display:block;margin-top:2px;font-size:7.5px;line-height:1.05;font-weight:800;color:#eef1f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#signatureTrack.cleared{border-color:#f2b84b88;background:rgba(41,32,16,.82);box-shadow:0 5px 22px #f2b84b22}
#signatureTrack.cleared span{color:#ffd995}
#signatureTrack.pulse{animation:sigPulse .28s ease-out}
@keyframes sigPulse{0%{transform:translateX(-50%) scale(1)}45%{transform:translateX(-50%) scale(1.035);box-shadow:0 5px 26px #f2b84b55}100%{transform:translateX(-50%) scale(1)}}
canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(8,10,14,.67);backdrop-filter:blur(4px);overflow:auto}
.card{width:min(780px,96%);max-height:96%;overflow:auto;background:rgba(26,31,39,.97);border:1px solid #3b424d;border-radius:16px;padding:16px;box-shadow:0 18px 50px #0008}
.card h1,.card h2,.card h3{margin:0 0 7px}.card p{margin:7px 0;color:#e1e5ea;line-height:1.32}
.location{font-size:10px;letter-spacing:.13em;color:var(--accent);font-weight:900;margin-bottom:6px}
button{appearance:none;border:0;border-radius:12px;padding:11px 13px;font:inherit;font-weight:900;color:white;background:#303743;cursor:pointer}
button:active{transform:translateY(1px)}
.welcome-hero{position:relative;height:min(42vh,320px);margin:-5px -5px 12px;overflow:hidden;border:2px solid #ffffff24;border-radius:15px;background:#07111b;box-shadow:0 14px 32px #0008}
.welcome-hero img{position:absolute;left:0;top:0;width:100%;height:auto;display:block;filter:saturate(1.08) contrast(1.04)}
.welcome-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 75%,rgba(7,12,18,.22))}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mode{position:relative;min-height:84px;overflow:hidden;border:2px solid #ffffff55;border-bottom-width:6px;text-shadow:0 2px 3px #0009;box-shadow:inset 0 2px #ffffff45,0 7px 14px #0006;transition:transform .1s,filter .1s}
.mode:before{content:'';position:absolute;inset:0;background:linear-gradient(145deg,#ffffff24,transparent 45%,#00000030);pointer-events:none}.mode:active{transform:translateY(3px);border-bottom-width:3px;filter:brightness(.92)}
#snowMode{background:linear-gradient(145deg,#20a9ef,#087acb)}#bikeMode{background:linear-gradient(145deg,#9bd14e,#528d28)}#boardMode{background:linear-gradient(145deg,#efb32f,#e76f26)}
.mode strong{position:relative;display:block;font-size:14px}.mode span{position:relative;display:block;margin-top:4px;color:#fff!important;opacity:1!important;font-size:10px;font-weight:950;letter-spacing:.08em}.modeIcon{font-size:22px!important;line-height:1;letter-spacing:.02em!important;margin:0 0 5px!important}
.secondary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.small{font-size:11px;color:#cbd1d8}
#controls{flex:0 0 auto;padding:7px max(9px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left));display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;background:#11151b;border-top:1px solid #2c323b}
#controls button{position:relative;min-height:68px;padding:31px 8px 8px;border:3px solid #111923;border-bottom-width:7px;border-radius:16px;font-size:16px;font-style:italic;letter-spacing:.025em;text-shadow:0 2px 2px #0007;touch-action:none;box-shadow:inset 0 3px #ffffff55,inset 0 -7px #00000025,0 5px 10px #0008}
#controls button:before{position:absolute;left:50%;top:5px;transform:translateX(-50%);display:block;font-style:normal;line-height:1;text-shadow:none}
#brake{background:linear-gradient(145deg,#ff5a50,#cf2628)}#brake:before{content:'';width:22px;height:22px;border:5px dotted #47181a;border-radius:50%;background:#ea3b38;box-shadow:inset 0 0 0 3px #8f2022}
#jump{background:linear-gradient(145deg,#27a9ff,#0877df);color:#fff}#jump:before{content:'↑';top:0;font-size:34px;font-weight:1000;color:#fff;filter:drop-shadow(0 2px #07529b)}
#send{background:linear-gradient(145deg,#ffc84d,#ee8b18);color:#17130a;text-shadow:0 1px #fff5}#send:before{content:'▲ ▲';top:7px;font-size:18px;letter-spacing:-6px;color:#2c2b26}
#brake.active,#jump.active,#send.active{box-shadow:inset 0 2px #ffffff33,inset 0 7px #00000025,0 2px 4px #0008;transform:translateY(3px) scale(.985);border-bottom-width:4px}
#controls button{transition:transform .08s ease,box-shadow .12s ease,background .12s ease}
.quote{font-size:16px;font-weight:850;line-height:1.25;margin:9px 0;padding:10px;border-left:4px solid var(--accent);background:#141820}.impact-card{margin:7px 0;padding:9px 10px;border:1px solid #56606d;border-radius:10px;background:linear-gradient(110deg,#20252d,#101319);font-size:11px;letter-spacing:.04em}.impact-card b{display:block;color:#f4f6f8;font-size:14px;margin-bottom:2px}.impact-card span{color:#bfc6cf}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.stat{background:#141820;padding:7px;border-radius:9px}.stat b{display:block;font-size:15px}
.result-layout{display:block}
.scoreboard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.board{background:#141820;border-radius:11px;padding:10px}.board h3{color:var(--accent)}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #282e36;font-size:11px}.row:last-child{border:0}
.run-rating{margin:7px 0;padding:8px 10px;border:1px solid #3d4652;border-radius:10px;background:#151a21}.run-rating b{color:var(--accent);font-size:15px;letter-spacing:.06em}.run-rating span{display:block;margin-top:2px;font-size:10px;color:#cbd1d8}
.share-card{position:relative;min-height:340px;overflow:hidden;margin:8px 0;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;border:2px solid #f2b84b88;border-radius:16px;background-position:center 22%;background-size:cover;box-shadow:inset 0 1px #ffffff24,0 14px 32px #0008}.share-card:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,9,15,.02) 20%,rgba(4,9,15,.35) 53%,rgba(4,9,15,.96) 100%)}.share-brand{position:relative;z-index:1;font-size:10px;font-weight:950;letter-spacing:.16em;color:#f2b84b}.share-headline{position:relative;z-index:1;margin:5px 0 10px;font-size:25px;font-weight:950;line-height:1}.share-badges{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.share-badge{padding:8px 6px;border:1px solid #ffffff28;border-radius:9px;background:#090c10cc;text-align:center;font-size:8px;color:#bfc7cf}.share-badge b{display:block;margin-top:2px;color:#fff;font-size:13px}.share-link{position:relative;z-index:1;margin-top:11px;font-size:9px;font-weight:800;color:#fff}.share-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}.share-status{min-height:16px;margin:5px 0 0;text-align:center;font-size:9px;color:#cbd1d8}
@media(max-width:600px){
 header{padding:calc(5px + env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 5px max(8px,env(safe-area-inset-left));display:grid;grid-template-columns:auto 1fr;align-items:start;gap:4px 8px}
 header>div:first-child{padding-top:2px}.title{font-size:17px;line-height:1}.subtitle{font-size:6.5px;margin-top:2px;white-space:nowrap}
 #hud{min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px 4px;font-size:7px;text-align:center;align-items:center}
 #hud b{font-size:9px}#alert,#section,#flowHud,#rideState,#ratingHud,#audioBtn{min-width:0;width:100%;padding-left:3px;padding-right:3px}
 #alert,#section{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meter{width:100%;max-width:54px;margin-left:auto;margin-right:auto}.flowMini{width:100%;max-width:48px}#flowHud{min-width:0}#rideState{min-width:0}#rideState b{font-size:8px;overflow:hidden;text-overflow:ellipsis}#ratingHud{min-width:0}#ratingHud b{font-size:8px;overflow:hidden;text-overflow:ellipsis}#audioBtn{min-width:0;padding:4px 3px;font-size:6.5px}
 #signatureTrack{top:5px;width:min(470px,86%);padding:4px 7px 5px}#signatureTrack .sigLabel{font-size:6px}#signatureTrack b{font-size:8.5px}#signatureTrack span{font-size:6.5px}
 .card{padding:11px}.card p{font-size:12px}.modes{gap:5px;margin:8px 0}.mode{min-height:65px;padding:7px 4px}.mode strong{font-size:11px}.mode span{font-size:7.5px}
 .welcome-hero{height:235px;margin:-2px -2px 9px}.modeIcon{font-size:17px!important}
 .quote{font-size:13px;padding:7px}.stats{gap:4px}.stat{font-size:9px;padding:5px}.stat b{font-size:13px}.scoreboard{grid-template-columns:1fr}
}
@media(orientation:landscape) and (max-height:500px){
 header{padding:calc(3px + env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 3px max(8px,env(safe-area-inset-left));display:flex}.subtitle{display:none}.title{font-size:14px}#hud{font-size:7px;gap:4px}#hud b{font-size:8px}.meter{width:42px;height:5px}#flowHud{min-width:42px}.flowMini{width:38px}#audioBtn{min-width:34px;padding:3px 4px;font-size:6px}
 #signatureTrack{top:3px;width:min(500px,58%);padding:3px 6px 4px}#signatureTrack .sigLabel{display:none}#signatureTrack b{display:inline;font-size:7px;margin-right:6px}#signatureTrack span{display:inline;font-size:6px}
 #controls{padding:3px max(7px,env(safe-area-inset-right)) calc(3px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left))}#controls button{min-height:45px;font-size:9px;padding:21px 4px 4px;border-radius:11px;border-width:2px;border-bottom-width:5px}#jump:before{font-size:25px;top:-1px}#brake:before{width:15px;height:15px;border-width:3px;top:4px}#send:before{font-size:13px;top:5px}
 .card{width:97%;max-width:940px;padding:7px 9px;overflow:hidden}.card h1{font-size:18px}.card h2{font-size:15px}.card p{font-size:9px;margin:3px 0;line-height:1.12}
 .modes{margin:4px 0;gap:4px}.mode{min-height:44px;padding:4px}.mode strong{font-size:9px}.mode span{font-size:6.5px}
 .result-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:7px}.quote{font-size:10px;margin:3px 0;padding:5px}.stats{margin:0 0 3px}.stat{font-size:7px;padding:3px}.stat b{font-size:10px}
 .secondary{margin:3px 0;gap:4px}.secondary button{padding:5px;font-size:8px}.scoreboard{grid-template-columns:repeat(3,1fr);gap:5px}.board{padding:5px}.board h3{font-size:10px}.row{font-size:7px;padding:2px 0}
}
</style>

const sendKeys=new Set(['KeyD','ArrowRight']);
function keyControl(code,down,repeat=false){
 if(jumpKeys.has(code)){
  if(down&&!repeat&&!heldKeys.has(code)){heldKeys.add(code);jumpBtn.classList.add('active');jump()}
  if(!down){heldKeys.delete(code);jumpBtn.classList.remove('active')}
  return true;
 }
 if(brakeKeys.has(code)){
  if(down){heldKeys.add(code);if(!braking){sfx('brake');brakeHold=0;braking=true}brakeBtn.classList.add('active')}
  else{heldKeys.delete(code);if(![...heldKeys].some(k=>brakeKeys.has(k)))releaseBrakeTechnique();brakeBtn.classList.remove('active')}
  return true;
 }
 if(sendKeys.has(code)){
  if(down){heldKeys.add(code);if(!sendIt)sfx('send');sendIt=true;sendBtn.classList.add('active')}
  else{heldKeys.delete(code);if(![...heldKeys].some(k=>sendKeys.has(k)))sendIt=false;sendBtn.classList.remove('active')}
  return true;
 }
 return false;
}
window.addEventListener('keydown',e=>{if(keyControl(e.code,true,e.repeat))e.preventDefault()},{passive:false});
window.addEventListener('keyup',e=>{if(keyControl(e.code,false,false))e.preventDefault()},{passive:false});
function releaseControls(){
 heldKeys.clear();braking=false;brakeHold=0;sendIt=false;
 brakeBtn.classList.remove('active');jumpBtn.classList.remove('active');sendBtn.classList.remove('active');
}
// v77 mobile QA: do not release every control when any one finger lifts.
// Brake and Send It use pointer capture and release themselves, so simultaneous touch inputs
// (for example Brake + Jump or Send It + Jump) remain held until their own pointer ends.
window.addEventListener('blur',releaseControls);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseControls()});
window.addEventListener('pagehide',releaseControls);
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('#controls'))e.preventDefault()});

function skillAward(base,label,boost=.25){
 flowChain=Math.min(13,flowChain+1);
 bestFlowChain=Math.max(bestFlowChain,flowChain);
 flowTimer=4.25;
 const mult=1+Math.max(0,flowChain-1)*boost;
 const pts=Math.round(base*mult);
 score+=pts;
 physicsCue=(label?label+'  ':'')+'FLOW x'+mult.toFixed(2)+'  +'+pts;
 physicsCueTimer=1.0;
 sfx('skill');
 return pts;
}

function checkLineMastery(){
 // Completing a named technical section at useful speed creates run-level progression.
 // Heavy braking can save a run, but it will not earn mastery: Jimmy has to be controlled and still carrying pace.
 const riderWx=world+player.x;
 while(nextMasteryFeature<terrainFeatures.length){
  const f=terrainFeatures[nextMasteryFeature];
  if(f.x+f.width>riderWx)break;
  nextMasteryFeature++;
  if(!f.complex||!f.label)continue;
  const choice=f.complexId!==undefined?lineChoices[f.complexId]:null;
  const baseThreshold=mode==='snow'?6.15:mode==='bike'?5.55:5.25;
  // FAST LINE is the higher-risk score route: it demands more exit speed and pays more.
  // CONTROL LINE rewards deliberate pace management: a lower speed gate, smaller award, and a little more meter recovery.
  const threshold=choice==='fast'?baseThreshold*1.08:choice==='control'?baseThreshold*.90:baseThreshold;
  if(speed>=threshold){
   masteryStreak++;
   masteredSections++;
   bestMasteryStreak=Math.max(bestMasteryStreak,masteryStreak);
   if(choice==='fast')fastLineClears++;
   if(choice==='control')controlLineClears++;
   const streakBase=220+Math.min(5,masteryStreak-1)*70;
   const styleMult=choice==='fast'?1.35:choice==='control'?.88:1;
   const label=choice==='fast'?'FAST LINE CLEAN':choice==='control'?'CONTROL LINE CLEAN':'LINE MASTERED';
   const pts=skillAward(Math.round(streakBase*styleMult),label);
   physicsCue=label+'  x'+masteryStreak+'  +'+pts;
   physicsCueTimer=1.15;
   const meterGain=choice==='control'?Math.min(10,5+masteryStreak):Math.min(8,3+masteryStreak);
   meter=Math.min(100,meter+meterGain);
  }else{
   masteryStreak=0;
   if(choice) {
    physicsCue=(choice==='fast'?'FAST LINE MISSED':'CONTROL LINE MISSED')+' · EXIT SPEED';
    physicsCueTimer=.85;
    sfx('miss');
   }
  }
 }
}

function update(dt){
 animClock+=dt;
 landingSquash=Math.max(0,landingSquash-dt*5.5);
 wheelSpin=(wheelSpin+speed*dt*.9)%(Math.PI*2);
 if(!running)return;runTime+=dt;if(physicsCueTimer>0)physicsCueTimer=Math.max(0,physicsCueTimer-dt);if(flowTimer>0){flowTimer=Math.max(0,flowTimer-dt);if(flowTimer===0)flowChain=0;}

 const wx=world+player.x;
 updateLineChoice();
 const slope=terrainSlopeAt(wx);
 const downhill=Math.max(-.08,Math.min(.08,slope));

 // Braking is progressive: a quick touch is a controlled speed check; holding it becomes a hard brake.
 // This preserves flow when Jimmy only needs to trim a line, while sustained braking remains unmistakably strong.
 if(braking)brakeHold=Math.min(1.2,brakeHold+dt);else brakeHold=0;
 const cruiseTarget=sendIt?10.4:6.15+meter*.018;
 let target=cruiseTarget;
 let response=sendIt?3.2:2.4;
 if(braking){
  if(brakeHold<.34){
   const checkRatio=mode==='bike'?.70:mode==='snow'?.74:.78;
   target=Math.max(2.65,speed*checkRatio);
   response=6.4;
  }else{
   target=1.55;
   response=12;
  }
 }
 // Terrain now matters: descents add speed, climbs scrub it; braking still wins over gravity.
 target+=downhill*(braking?8:18);

 speed+=(target-speed)*Math.min(1,response*dt);
 speed=Math.max(1.35,Math.min(11.1,speed));

 // v47 high-speed stability: sharp terrain transitions load the edge/front end/trucks.
 // Jimmy can carry serious speed, but entering a technical compression or direction change
 // unprepared now has a consequence. Braking and a prepared line actively restore stability.
 if(player.onGround){
  const slopeBack=terrainSlopeAt(wx-36), slopeAhead=terrainSlopeAt(wx+64);
  const transitionLoad=Math.min(.62,Math.abs(slopeAhead-slopeBack));
  const modeThreshold=mode==='snow'?6.65:mode==='bike'?6.35:6.15;
  const excess=Math.max(0,speed-modeThreshold);
  const load=Math.max(0,(transitionLoad-.075))*excess*(sendIt?1.30:1);
  if(load>0){
   const prepared=Math.min(.82,lineSet*.55+(braking?.42:0));
   stability-=load*(1-prepared)*dt*29;
  }else stability+=dt*(braking?34:18);
  if(braking)stability+=dt*(brakeHold<.34?13:24);
  stability=Math.max(0,Math.min(100,stability));
  if(stability<64&&stabilityCueReady){
   physicsCue=mode==='snow'?'EDGE LOAD':mode==='bike'?'FRONT END LOAD':'SPEED WOBBLE';
   physicsCueTimer=.72;stabilityCueReady=false;
  }
  if(stability>78)stabilityCueReady=true;
  if(stability<=0){
   crash({type:mode==='snow'?'edgewash':mode==='bike'?'frontload':'wobble'});
   return;
  }
 }else stability=Math.min(100,stability+dt*9);

 world+=speed*60*dt;
 checkLineMastery();

 if(sendIt){meter=Math.min(100,meter+dt*4.7);score+=dt*42}
 else if(braking)meter=Math.max(0,meter-dt*5.8);
 else meter=Math.max(0,meter-dt*1.15);

 // Experienced line-setting: a short brake set before takeoff trades entry speed for landing precision.
 if(player.onGround&&braking&&!sendIt&&speed>2.2){
  lineSet=Math.min(1,lineSet+dt*1.8);
  if(lineSet>=.72&&!lineSetReady){lineSetReady=true;physicsCue='LINE SET';physicsCueTimer=.65}
 }else if(player.onGround&&!braking){
  lineSet=Math.max(0,lineSet-dt*.55);
  if(lineSet<.5)lineSetReady=false;
 }

 score+=dt*12*speed/6;
 if(world>nextSpawn)spawn();

 let gy=groundY(player.x)-player.h;
 const surfaceAngle=terrainAngleAt(world+player.x);

 if(!player.onGround){
  player.vy+=28*dt;
  player.y+=player.vy;
  airTime+=dt;totalAir+=dt;

  // In the air Jimmy can influence attitude slightly. A pre-takeoff line set adds controlled
  // convergence toward the upcoming landing surface without making the landing automatic.
  if(sendIt)player.rot+=.040;
  else if(braking)player.rot-=.025;
  else player.rot+=.010;

  // v61 landing absorption: an experienced rider can hold BRAKE on final descent to absorb a rough touchdown.
  // It does not erase a bad line; it gently matches the landing surface and trades a little exit speed for control.
  const landingDistance=gy-player.y;
  let absorbingLanding=false;
  if(braking&&player.vy>1.8&&landingDistance>=0&&landingDistance<58){
   absorbingLanding=true;
   const absorb=Math.max(0,1-landingDistance/58);
   const desired=surfaceAngle;
   const delta=((desired-player.rot+Math.PI*3)%(Math.PI*2))-Math.PI;
   player.rot+=delta*Math.min(.20,dt*(2.6+absorb*5.2))*absorb;
   player.vy-=Math.min(.11,absorb*.07);
  }
  if(airLineSet>.02){
   const lookAhead=world+player.x+Math.max(42,speed*13);
   const desired=terrainAngleAt(lookAhead);
   const delta=((desired-player.rot+Math.PI*3)%(Math.PI*2))-Math.PI;
   player.rot+=delta*Math.min(.11,dt*(1.2+airLineSet*3.4))*airLineSet;
  }

  if(player.y>=gy){
   const landingError=angleDelta(player.rot,surfaceAngle);
   const impactVy=player.vy;
   const landingSlope=terrainSlopeAt(world+player.x);
   const landingAbsorb=braking&&impactVy>2.4;
   const effectiveLandingError=landingError*(landingAbsorb?.76:1);
   const hardLanding=airTime>.36 && speed>6.6 && effectiveLandingError>1.05;

   player.y=gy;
   if(hardLanding){
    crash({type:'landing'});
    return;
   }

   player.vy=0;player.onGround=true;landingSquash=Math.min(1,Math.abs(impactVy)/14);sfx('land');
   if(airTrick&&airTime>.42){tricksLanded++;skillAward(jumpTapCount===3?340:210,airTrick+' LANDED');}
   player.rot=surfaceAngle;

   if(landingAbsorb&&airTime>.34){
    const roughness=Math.min(1,landingError/.95);
    const scrub=.18+.30*roughness;
    speed=Math.max(1.35,speed-scrub);
    stability=Math.min(100,stability+12+roughness*12);
    if(landingError>.38||impactVy>6.2){
     skillAward(Math.round(70+roughness*95),'ABSORBED LANDING');
     physicsCue='ABSORBED LANDING  -'+Math.max(1,Math.round(scrub*4.8))+' mph';
     physicsCueTimer=.9;
    }
   }

   if(airTime>.32){
    score+=Math.floor(airTime*330*(1+meter/100));
    meter=Math.min(100,meter+airTime*7);

    // Flow physics: match the landing transition and Jimmy carries momentum.
    // Land against the grade and the terrain scrubs speed instead.
    const cleanLanding=Math.max(0,1-landingError/.85);
    if(landingSlope>.055 && impactVy>2.2 && cleanLanding>.35){
     const flowBoost=Math.min(1.35,.25+landingSlope*4.2+airTime*.32)*cleanLanding;
     speed=Math.min(11.1,speed+flowBoost);
     skillAward(Math.round(90+flowBoost*110),'FLOW LANDING');
     meter=Math.min(100,meter+3+flowBoost*2);
     speed=Math.min(11.1,speed+.08);
     physicsCue+='  +'+Math.round(flowBoost*4.8)+' mph';
     physicsCueTimer=1.05;
    }else if(landingSlope<-.07 && impactVy>2.4){
     const scrub=Math.min(.85,.18+Math.abs(landingSlope)*2.8);
     speed=Math.max(1.35,speed-scrub);
     physicsCue='UPHILL LANDING  -'+Math.max(1,Math.round(scrub*4.8))+' mph';
     physicsCueTimer=.8;
    }else if(cleanLanding>.72 && impactVy>3.0){
     skillAward(75,'CLEAN LANDING');
     physicsCueTimer=.75;
    }
   }
   airTime=0;airLineSet=0;jumpTapCount=0;airTrick='';
  }
 }else{
  player.y=gy;
  player.rot=surfaceAngle;

  // Real crest/drop behavior: if the ground falls away quickly, Jimmy leaves it.
  const nearGround=groundY(player.x+12);
  const aheadGround=groundY(player.x+62);
  const fallAway=aheadGround-nearGround;
  const crest=terrainSlopeAt(world+player.x+12)-terrainSlopeAt(world+player.x+62);

  // v71 authored-ramp takeoff physics: genuine ramp terrain now has a deliberate lip launch.
  // This fires only while riding the final takeoff/lip zone, so ramps launch Jimmy rather than
  // relying on the generic crest detector. Entry speed and SEND IT increase pop; a prepared
  // brake-set sacrifices a little height but carries more stability into the landing.
  const rampFeature=currentFeature(world+player.x+18);
  let rampLaunch=false;
  if(rampFeature&&rampFeature.kind==='ramp'&&world-lastAutoLaunch>230){
   const ru=(world+player.x+18-rampFeature.x)/rampFeature.width;
   if(ru>=.54&&ru<=.70&&speed>3.8){
    const prepared=Math.min(1,lineSet);
    const pop=(sendIt?.76:.56)+(speed-3.8)*.075-prepared*.08;
    airLineSet=lineSet;lineSet=0;lineSetReady=false;
    player.onGround=false;
    player.vy=-Math.max(3.0,Math.min(6.8,speed*pop));
    player.rot=surfaceAngle;
    stability=Math.min(100,stability+prepared*7);
    lastAutoLaunch=world;rampLaunch=true;
    physicsCue=sendIt?'RAMP POP · SEND IT':prepared>.55?'RAMP POP · LINE SET':'RAMP POP';
    physicsCueTimer=.72;
   }
  }
  if(!rampLaunch&&speed>5.2 && world-lastAutoLaunch>230 && (fallAway>15 || crest>.22)){
   airLineSet=lineSet;lineSet=0;lineSetReady=false;
   player.onGround=false;
   player.vy=Math.min(-2.2,-speed*.42 + surfaceAngle*2.5);
   lastAutoLaunch=world;
  }
 }

 let nearLabel='';
 for(const o of obstacles){
  let sx=o.wx-world;
  updateEncounterBehavior(o,sx,dt);updateMaintenanceBehavior(o,sx,dt);
  o.wx+=o.vx*dt;sx=o.wx-world;let oy=groundY(sx)-o.h;
  if(sx<W*.82&&sx>player.x+70){
   if(o.type==='lion')nearLabel='MOUNTAIN LION';
   else if(o.type==='bear')nearLabel='BLACK BEAR';
   else if(o.type==='skier')nearLabel='SKIER AHEAD';
   else if(o.type==='hiker')nearLabel='HIKER AHEAD';
   else if(o.type==='car')nearLabel='CAR AHEAD';
   else if(o.type==='snowcat')nearLabel='GROOMER CROSSING';
   else if(o.type==='trailcart')nearLabel='TRAIL CREW AHEAD';
   else if(o.type==='utilityvan')nearLabel='DRIVEWAY VEHICLE';
   else if(o.type==='streetfreeze')nearLabel='FROZEN PEDESTRIAN';
   else if(o.type==='pedestrian')nearLabel='PEDESTRIAN DRIFT';
   else if(o.type==='slowzone')nearLabel='SLOW ZONE';
   else if(o.type==='trailwarning')nearLabel='TRAIL TRAFFIC';
   else if(o.type==='slalomsign')nearLabel='HUMAN SLALOM';
   else if(o.type==='workzone')nearLabel='MOUNTAIN OPS';
   else if(o.type==='trailwork')nearLabel='TRAIL WORK';
   else if(o.type==='drivewayout')nearLabel='ACTIVE DRIVEWAY';
   else if(o.type==='parkrail')nearLabel='PARK RAIL';
   else if(o.type==='roots')nearLabel='ROOTS';
   else if(o.type==='roadpatch')nearLabel='ROAD PATCH';
   if(nearLabel&&o.lineChoice&&!o.wildlife&&!o.event)nearLabel=(o.lineChoice==='fast'?'FAST LINE · ':'CONTROL LINE · ')+nearLabel;
  }
  if(!o.decor&&!o.hit&&player.x+player.w-5>sx&&player.x+5<sx+o.w&&player.y+player.h-4>oy&&player.y+7<oy+o.h){
   o.hit=true;
   // v66 Props/Hazards: traffic cones are now breakaway soft props. Jimmy can clip one,
   // lose a little composure, and keep the run alive instead of suffering a cheap full crash.
   if(o.type==='cone'){
    o.knocked=true;o.vx=-115;stability=Math.max(0,stability-12);score=Math.max(0,score-90);
    physicsCue='CONE CLIP · KEEP IT MOVING';physicsCueTimer=.85;tone(150,.06,'square',.022,-45);
   }else{crash(o);return}
  }
  if(!o.decor&&!o.passed&&sx+o.w<player.x){
   o.passed=true;let clear=Math.abs((player.y+player.h)-oy);
   if(clear<26){closeCalls++;meter=Math.min(100,meter+8);skillAward(180,'CLOSE CALL')}else score+=80;
   if(o.wildlife){meter=Math.min(100,meter+18);skillAward(750,'WILDLIFE ENCOUNTER');physicsCueTimer=1.05}
   else if(o.event){meter=Math.min(100,meter+10);skillAward(mode==='board'?360:300,mode==='board'?'HUMAN SLALOM':'THREAD THE NEEDLE');physicsCueTimer=.9}
   else if(o.maintenance){meter=Math.min(100,meter+12);skillAward(420,mode==='snow'?'OPS CROSSING':mode==='bike'?'TRAIL CREW LINE':'DRIVEWAY GAP');physicsCueTimer=.95}
  }
 }

 checkSignatureChallenge();
 alertEl.textContent=nearLabel||'CAUTION';
 alertEl.style.opacity=nearLabel?'1':'0';
 const activeSectionLabel=sectionLabel();
 sectionEl.textContent=activeSectionLabel;
 sectionEl.classList.toggle('fast',activeSectionLabel.includes('FAST LINE'));
 sectionEl.classList.toggle('control',activeSectionLabel.includes('CONTROL LINE'));

 obstacles=obstacles.filter(o=>o.wx-world>-120);
 if(runTime>45)finish();
 hud()
}

function crash(o){
 sfx('crash');setTimeout(playCrashVoice,520);running=false;ended=true;let injury=injuries[Math.floor(Math.random()*injuries.length)];
 for(let i=0;i<32;i++)particles.push({x:player.x+18,y:player.y+25,vx:rand(-6,6),vy:rand(-8,2),life:rand(38,70)});
 let n=0,t=setInterval(()=>{drawScene();player.x+=2.4;player.y+=2.7;drawCrashPlayer(n/22,o.type);drawParticles();if(++n>22){clearInterval(t);results(true,injury,o.type)}},30)
}
function finish(){running=false;ended=true;results(false,null,null)}
function results(crashed,injury,hit,snapshot=null){
 let q=snapshot?.q||quotes[Math.floor(Math.random()*quotes.length)],final=snapshot?.final??Math.floor(score+(crashed?0:900));score=final;let rating=snapshot?.rating||runRating(),signature=snapshot?.signature||signatureChallenge(),title=snapshot?.title||masteryTitle(mode,rating.tier,signature.complete);if(!snapshot)save();overlay.style.display='flex';
 let career=careerProgress();
 let landingNote=hit==='landing'?'Bad landing angle. Physics requested a correction.':hit==='edgewash'?'Too much edge load through the transition. A speed check or earlier line set would hold it.':hit==='frontload'?'The front end overloaded through the transition. Set the line or trim speed before it.':hit==='wobble'?'The trucks ran out of composure before Jimmy did. Brake before the transition and release cleanly.':null;
 let jimmyCrash=snapshot?.jimmyCrash||crashLine(hit),impact=impactReadout(hit);
 card.innerHTML=`<div class="location">${MODES[mode].name} — ${MODES[mode].tag}</div><h2>${crashed?'RUN TERMINATED':'JIMMY LIVES'}</h2>
 <div class="result-layout"><div>${mode==='snow'&&throwbackSnow?`<div class="location">THROWBACK JIMMY · EARLY ’90s KIT</div>`:''}<div class="quote">“${q}”</div>${crashed?`<div class="impact-card"><b>${impact[0]}</b><span>${impact[1]}</span></div><p><b>Diagnosis:</b> ${injury}.</p>${landingNote?`<p><b>Terrain report:</b> ${landingNote}</p>`:''}<p><b>Jimmy:</b> “${jimmyCrash}”</p>`:`<p><b>Medical outcome:</b> Suspiciously intact.</p><p><b>Jimmy:</b> “That line has more in it.”</p>`}</div>
 <div><div class="run-rating">MASTERY <b>${title}</b><span>${rating.name} RUN · ${signature.complete?'SIGNATURE CLEARED':signature.name+' OPEN'}</span></div><div class="run-rating">JIMMY CAREER <b>${career.title}</b><span>SIGNATURE STAMPS ${career.stamps}/3${career.complete?' · ALL-TERRAIN COMPLETE':' · NEXT: '+career.next}</span></div><div class="run-rating">ALL-TERRAIN TOUR <b>${career.tourTitle}</b><span>TOUR SCORE ${career.tourScore.toLocaleString()} · ${career.tourMax?'TOP TOUR TIER':'NEXT TIER IN '+career.tourNext.toLocaleString()+' PTS'}</span></div><div class="stats"><div class="stat">Score<b>${final}</b></div><div class="stat">Best Flow<b>x${(1+Math.max(0,bestFlowChain-1)*.25).toFixed(2)}</b></div><div class="stat">Airtime<b>${totalAir.toFixed(1)} sec</b></div><div class="stat">Tricks Landed<b>${tricksLanded}</b></div></div>
 <div class="secondary"><button id="again">ONE MORE RUN</button><button id="menu">CHANGE SPORT</button></div><div class="secondary"><button id="details">FULL RUN STATS</button><button id="share">DECLARE VICTORY</button></div></div></div>`;
 $('again').onclick=()=>{overlay.style.display='none';resize();reset()};$('menu').onclick=start;
 $('details').onclick=()=>showRunDetails({crashed,injury,hit,q,final,title,rating,signature,jimmyCrash});
 $('share').onclick=()=>showShareCard({crashed,injury,hit,q,final,title,rating,signature,jimmyCrash});
}
function showRunDetails(run){
 card.innerHTML=`<div class="location">${MODES[mode].name} · FULL RUN STATS</div><h2>${run.title}</h2><div class="run-rating">RUN RATING <b>${run.rating.name}</b><span>${run.rating.why}</span></div><div class="run-rating">SIGNATURE: <b>${run.signature.name}</b><span>${run.signature.complete?'CLEARED · +'+run.signature.reward+' points':run.signature.progress}</span></div><div class="stats"><div class="stat">Score<b>${run.final}</b></div><div class="stat">Jimmy Meter<b>${Math.round(meter)}%</b></div><div class="stat">Close calls<b>${closeCalls}</b></div><div class="stat">Airtime<b>${totalAir.toFixed(1)} sec</b></div><div class="stat">Best Flow<b>x${(1+Math.max(0,bestFlowChain-1)*.25).toFixed(2)}</b></div><div class="stat">Tricks landed<b>${tricksLanded}</b></div><div class="stat">Line streak<b>${bestMasteryStreak}</b></div><div class="stat">Mastered lines<b>${masteredSections}</b></div><div class="stat">Fast clears<b>${fastLineClears}</b></div><div class="stat">Control clears<b>${controlLineClears}</b></div></div><div class="secondary"><button id="detailsBack">BACK TO RESULTS</button><button id="scoreBtn">SCOREBOARD</button></div>`;
 $('detailsBack').onclick=()=>results(run.crashed,run.injury,run.hit,run);$('scoreBtn').onclick=showScores
}
function showShareCard(run){
 const playUrl='https://hoopstetter.github.io/CrashingJimmy/';
 const flow='x'+(1+Math.max(0,bestFlowChain-1)*.25).toFixed(2);
 card.innerHTML=`<div class="share-card" style="background-image:url('${HERO_ART}')"><div class="share-brand">CRASH'N JIMMY · FAST LINES. GREAT STORIES.</div><div class="share-headline">${MODES[mode].name}<br>${run.title}</div><div class="share-badges"><div class="share-badge">SCORE<b>${run.final}</b></div><div class="share-badge">RUN RATING<b>${run.rating.name}</b></div><div class="share-badge">BEST FLOW<b>${flow}</b></div></div><div class="share-link">Think you can beat it? hoopstetter.github.io/CrashingJimmy/</div></div><div class="share-actions"><button id="shareNow">SHARE THIS CARD</button><button id="shareBack">BACK TO RESULTS</button></div><p class="share-status" id="shareStatus">Sends the visual achievement card and a direct game link.</p>`;
 $('shareBack').onclick=()=>results(run.crashed,run.injury,run.hit,run);
 $('shareNow').onclick=async()=>{
  const text=`JIMMY — ${MODES[mode].name}\n${run.title} mastery · ${run.rating.name} run\n${run.final} points · ${flow} best flow · ${totalAir.toFixed(1)}s airtime\n${run.signature.name}: ${run.signature.complete?'CLEARED':'OPEN'}\n\nThink you can beat it?`;
  const status=$('shareStatus');
  try{
   const imageBlob=await buildAchievementImage(run,flow);
   const imageFile=new File([imageBlob],'crashin-jimmy-'+mode+'-'+run.final+'.png',{type:'image/png'});
   if(navigator.share&&navigator.canShare?.({files:[imageFile]})){await navigator.share({title:'JIMMY — '+MODES[mode].name,text,url:playUrl,files:[imageFile]});status.textContent='Achievement card shared.'}
   else if(navigator.share){await navigator.share({title:'JIMMY — '+MODES[mode].name,text,url:playUrl});status.textContent='Run shared.'}
   else if(navigator.clipboard){await navigator.clipboard.writeText(text+'\n'+playUrl);status.textContent='Achievement and game link copied.'}
   else{status.textContent='Sharing is not available in this browser.'}
  }catch(e){if(e&&e.name!=='AbortError')status.textContent='Sharing did not complete. Try again or use a browser with sharing enabled.'}
 };
}
async function buildAchievementImage(run,flow){
 const out=document.createElement('canvas');out.width=1080;out.height=1350;const g=out.getContext('2d');
 const img=new Image();img.src=HERO_ART;await img.decode();
 const scale=Math.max(out.width/img.width,out.height/img.height),sw=out.width/scale,sh=out.height/scale;
 g.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,out.width,out.height);
 const shade=g.createLinearGradient(0,250,0,1350);shade.addColorStop(0,'rgba(4,10,17,.06)');shade.addColorStop(.52,'rgba(4,10,17,.42)');shade.addColorStop(1,'rgba(4,10,17,.96)');g.fillStyle=shade;g.fillRect(0,0,1080,1350);
 g.fillStyle='#f2b84b';g.fillRect(64,810,952,8);
 g.textAlign='left';g.fillStyle='#fff';g.font='900 86px system-ui';g.fillText('JIMMY',64,915);
 g.fillStyle='#f2b84b';g.font='900 34px system-ui';g.fillText(MODES[mode].name+' · '+run.rating.name+' RUN',67,970);
 g.fillStyle='#fff';g.font='900 66px system-ui';g.fillText(run.title,64,1055);
 const badges=[['SCORE',String(run.final)],['BEST FLOW',flow],['AIRTIME',totalAir.toFixed(1)+'s']];
 badges.forEach((b,i)=>{const x=64+i*320;g.fillStyle='rgba(8,14,21,.82)';g.strokeStyle='rgba(255,255,255,.26)';g.lineWidth=3;g.beginPath();g.roundRect(x,1100,288,128,18);g.fill();g.stroke();g.fillStyle='#bfc9d2';g.font='800 21px system-ui';g.fillText(b[0],x+20,1137);g.fillStyle='#fff';g.font='900 43px system-ui';g.fillText(b[1],x+20,1195)});
 g.fillStyle='#fff';g.font='800 27px system-ui';g.fillText(run.signature.name+' · '+(run.signature.complete?'CLEARED':'OPEN'),66,1285);
 g.fillStyle='#f2b84b';g.textAlign='right';g.fillText('hoopstetter.github.io/CrashingJimmy',1015,1285);
 return await new Promise((resolve,reject)=>out.toBlob(b=>b?resolve(b):reject(new Error('Image export failed')),'image/png'))
}

function dynamicAtmospherePass(){
 // v43 environment-graphics pass: moving atmospheric detail that reinforces place and speed without affecting gameplay.
 ctx.save();
 const t=performance.now()*.001;
 if(mode==='snow'){
  // Fine windblown powder and occasional longer gusts; all screen-space and non-collidable.
  ctx.lineCap='round';
  for(let i=0;i<34;i++){
   const seed=i*37.17;
   const drift=(world*.22 + t*(34+(i%5)*7) + seed*19)%(W+120)-60;
   const y=H*.18 + ((seed*29)%Math.max(80,H*.60));
   const len=7+(i%6)*3;
   ctx.globalAlpha=.11+(i%4)*.035;
   ctx.strokeStyle='#ffffff';ctx.lineWidth=1+(i%3)*.35;
   ctx.beginPath();ctx.moveTo(drift,y);ctx.lineTo(drift-len,y+2.5);ctx.stroke();
  }
  ctx.globalAlpha=.12;ctx.strokeStyle='#d8edf7';ctx.lineWidth=2;
  for(let i=0;i<5;i++){
   const x=(i*257-(world*.41+t*46)%257)-70;
   const y=H*.50+(i%3)*24;
   ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+55,y-8,x+118,y-2);ctx.stroke();
  }
 }else if(mode==='bike'){
  // OC dust hangs low in the canyon and trails the terrain direction, selling dry speed without obscuring hazards.
  for(let i=0;i<22;i++){
   const seed=i*53.41;
   const x=(seed*17-world*.18+t*(7+(i%4)*2))%(W+100)-50;
   const gy=groundY(Math.max(0,Math.min(W,x)));
   const y=gy-18-((seed*11)%74);
   const r=1.2+(i%5)*.75;
   ctx.globalAlpha=.055+(i%4)*.025;ctx.fillStyle='#e8c18d';
   ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=.065;ctx.fillStyle='#c8945f';
  for(let i=0;i<5;i++){
   const x=(i*243-(world*.33+t*10)%243)-60, y=H*.59+(i%3)*17;
   ctx.beginPath();ctx.ellipse(x,y,72+(i%2)*25,8,0,0,Math.PI*2);ctx.fill();
  }
 }else{
  // SoCal gets subtle asphalt heat shimmer plus layered smog streaks; lines stay below the main action silhouette.
  ctx.globalAlpha=.075;ctx.strokeStyle='#ffd6b5';ctx.lineWidth=1.2;
  for(let i=0;i<10;i++){
   const baseY=H*.69+i*9;
   ctx.beginPath();
   for(let x=0;x<=W;x+=18){
    const y=baseY+Math.sin(x*.035+t*2.2+i*.9)*1.8;
    x?ctx.lineTo(x,y):ctx.moveTo(x,y);
   }
   ctx.stroke();
  }
  for(let i=0;i<9;i++){
   const x=(i*151-(world*.28+t*14)%151)-45;
   const y=H*.44+(i%4)*18;
   ctx.globalAlpha=.035+(i%3)*.02;ctx.fillStyle='#edb090';
   ctx.beginPath();ctx.ellipse(x,y,58+(i%3)*16,5,0,0,Math.PI*2);ctx.fill();
  }
 }
 ctx.restore();
}

function drawPlayer(){

 const bob=player.onGround?Math.sin(animClock*8.5+world*.022)*.9:0;
 const squash=landingSquash*4.8;
 const carve=Math.sin(animClock*2.35+world*.0065);
 const airStyle=Math.min(1,airTime/.72);
 // v32 character pass: flight-phase animation makes takeoff, established air, and landing preparation visibly distinct.
 // This is visual only; it does not alter jump, rotation, landing, or collision physics.
 const airRising=airborne&&player.vy<-2.2;
 const airLanding=airborne&&player.vy>2.4;
 const airFloat=airborne&&!airRising&&!airLanding;
 // v41 air-control readability: the existing midair pitch inputs now have clear sport-specific body language.
 // SEND IT reads as forward/committed; BRAKE reads as checking rotation and preparing to bring the nose up.
 const airForward=airborne&&sendIt;
 const airBack=airborne&&braking;
 const pace=Math.min(1,Math.max(0,(speed-4)/6));
 const brakePose=braking&&!airborne;
 const sendPose=sendIt&&!airborne;
 const linePose=lineSet>.42&&!airborne;
 // v64 Jimmy & animation: short anticipation window before takeoff. Jimmy visibly preloads the
 // suspension/legs as a ramp lip approaches, making jumps read as intentional riding rather than
 // the sprite simply being launched by terrain. Visual-only: physics, collision and scoring untouched.
 const riderWx=world+player.x;
 let launchApproach=0;
 if(player.onGround){
  for(const f of terrainFeatures){
   if(f.type!=='ramp')continue;
   const lip=f.x+f.width;
   const d=lip-riderWx;
   if(d>0&&d<260){launchApproach=Math.max(launchApproach,1-d/260);break}
  }

 function head(x,y,r=8){

  ctx.strokeStyle=ink;ctx.fillStyle=skin;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-r*.70,-r*.72);ctx.quadraticCurveTo(-r*.98,-r*.18,-r*.72,r*.46);

  ctx.quadraticCurveTo(r*.95,-r*.18,r*.66,-r*.70);ctx.quadraticCurveTo(0,-r*.96,-r*.70,-r*.72);ctx.closePath();ctx.fill();ctx.stroke();

 function torso(x1,y1,x2,y2,w=5){

 function limb(x1,y1,x2,y2,w=4){

  ctx.strokeStyle='#303b45';ctx.lineWidth=Math.max(1.7,w-1.2);ctx.stroke()
 }

 if(mode==='snow'){
  // Snowboard: sideways stance, low edge-set under braking, compact grab/tweak in longer air.
  // v73 Throwback '93 uses the same competent physics/animation with a distinct period kit and old-school deck silhouette.
  const crouch=(sendPose?3.2:0)+(brakePose?5.2:0)+(linePose?2.0:0)+(preload*5.0)+squash+(airborne?airStyle*1.5:0)+(airLanding?3.0:0);
  const hipY=9+crouch*.58, shoulderY=-7+crouch*.28, headY=-19+crouch*.30;
  const tweak=airborne?Math.sin(Math.min(1,airStyle)*Math.PI)*5:0;
  head(2,headY,8);
  limb(1,headY+8,-1,shoulderY,4.6);torso(-1,shoulderY,-2,hipY,4.8);
  // arms: balance on snow, rear-hand grab once established in the air
  if(airTrick==='SPREAD EAGLE'&&airFloat){
   limb(-1,shoulderY,-24,shoulderY-5,4);limb(0,shoulderY,24,shoulderY-5,4);
  }else if(airLanding){
   // Landing-ready: hands come forward and the stance compresses before contact.
   limb(-1,shoulderY,-13,shoulderY+5,4);limb(0,shoulderY,14,shoulderY+4,4);
  }else if(airForward){
   // SEND IT in the air: shoulders lead down-course and the rear arm trails, matching the forward pitch input.
   limb(-1,shoulderY,-13,shoulderY+7,4);limb(0,shoulderY,18,shoulderY-8,4);
  }else if(airBack){
   // BRAKE in the air: chest opens and both arms rise slightly as Jimmy checks the rotation.
   limb(-1,shoulderY,-17,shoulderY-7,4);limb(0,shoulderY,14,shoulderY-9,4);
  }else if(airborne&&airTime>.38){
   limb(-1,shoulderY,-12,shoulderY+4,4);limb(-12,shoulderY+4,-16,21-tweak*.2,3.6);
   limb(0,shoulderY,15,shoulderY-5-tweak*.3,4);
  }else{
   const spread=brakePose?17:sendPose?12:20;
   limb(-1,shoulderY,-spread,shoulderY+(carve*4),4);limb(0,shoulderY,spread-2,shoulderY-(carve*3),4);
  }
  // knees visibly absorb landings; bindings anchor the feet to the deck
  limb(-2,hipY,-13,18+crouch*.18,4.2);limb(-13,18+crouch*.18,-14,24,4.2);
  limb(-1,hipY,11,18+crouch*.12,4.2);limb(11,18+crouch*.12,13,23,4.2);
  const flex=player.onGround?(1.4+landingSquash*3.4):(.4+airStyle*.8);
  ctx.strokeStyle=ink;ctx.lineWidth=throwbackSnow?6.2:5;ctx.beginPath();ctx.moveTo(throwbackSnow?-33:-29,26+tweak*.08);ctx.quadraticCurveTo(0,26+flex,throwbackSnow?34:31,24-tweak*.10);ctx.stroke();
  if(throwbackSnow){ctx.strokeStyle='#d45d8f';ctx.lineWidth=2.3;ctx.beginPath();ctx.moveTo(-28,24.5);ctx.lineTo(29,23);ctx.stroke()}
  ctx.strokeStyle=throwbackSnow?'#f0cf58':accent;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-17,24);ctx.lineTo(-12,19);ctx.moveTo(15,23);ctx.lineTo(10,18);ctx.stroke();

 }else if(mode==='bike'){
  // MTB: elbows and knees stay active, body moves independently from the bike, suspension compresses on impact.
  const compression=squash*1.05+(brakePose?2.6:0)+(linePose?1.2:0)+(preload*4.2)+(airLanding?3.2:0);

   limb(0,shoulderY,-8,shoulderY+7,4);limb(1,shoulderY,16,shoulderY-7,4);

   limb(0,shoulderY,-18,shoulderY-8,4);limb(1,shoulderY,17,shoulderY-5,4);

function drawCrashPlayer(progress,hit){
 // v49 Jimmy & animation: crashes now read differently by sport instead of using one generic pinwheel.
 // Visual-only choreography: no collision, scoring, speed, or recovery rules are changed.
 const t=Math.max(0,Math.min(1,progress));
 const ease=1-Math.pow(1-t,2);
 ctx.save();
 ctx.translate(player.x+18,player.y+26);
 const ink='#171a20',skin='#d6a06f',blue='#315f83',gear='#252b32',accent='#f2b84b';
 function L(x1,y1,x2,y2,w=4,c=ink){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}

  // Snow: edge catches, board comes across the fall line, Jimmy separates into a compact shoulder roll.
  const r=-.18+ease*1.55;ctx.rotate(r);
  const sep=Math.max(0,(t-.32))*34;
  H(3,-19+sep*.18);L(2,-11,-1,7,5,blue);
  L(-1,0,-16,-6-sep*.15,4);L(0,0,15,7+sep*.10,4);
  L(-1,7,-13,20,4);L(-1,7,13,18,4);
  ctx.save();ctx.translate(0,sep);ctx.rotate(.25+ease*.9);ctx.strokeStyle=ink;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-30,25);ctx.quadraticCurveTo(0,28,31,24);ctx.stroke();ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-15,24);ctx.lineTo(-10,19);ctx.moveTo(14,23);ctx.lineTo(9,18);ctx.stroke();ctx.restore();
 }else if(mode==='bike'){
  // MTB: front-end event pitches the bike first; Jimmy goes over it rather than rotating as one rigid unit.
  const bodyRot=ease*1.25;ctx.rotate(bodyRot);
  const bikeDrop=Math.max(0,t-.24)*22;
  ctx.save();ctx.translate(-3,bikeDrop);ctx.rotate(ease*.95);

function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/70);ctx.fillStyle=mode==='snow'?'#fff':mode==='bike'?'#d6ad79':'#bbb';ctx.fillRect(p.x,p.y,5,5);p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.life--}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0)}

let last=performance.now();
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;if(running)update(dt);if(!ended||running||introActive){drawScene();if(introActive){drawLocationIntro(now)}else{brakeSpray();drawPlayer();drawPhysicsCue();drawParticles()}}requestAnimationFrame(loop)}
